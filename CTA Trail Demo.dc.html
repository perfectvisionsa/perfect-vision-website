<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#F0F0F0;}
    *{box-sizing:border-box;font-family:'Readex Pro',sans-serif;}
    .pv-cta-pill{transition:background .3s ease,transform .25s ease;}
        /* pv-ar-leading: Arabic (RTL) leading floor. Readex Pro bold/tight headings collide between lines; any bold or tight-leaded text gets >= 1.45 leading. Site-wide, do not remove. */
  [dir="rtl"] :is(h1,h2,h3,h4,h5,h6,strong,b,[style*="font-weight: 600"],[style*="font-weight: 700"],[style*="font-weight: 800"],[style*="font-weight: bold"],[style*="font-weight:600"],[style*="font-weight:700"],[style*="font-weight:800"],[style*="font-weight:bold"],[style*="line-height: 1;"],[style*="line-height: 1.0"],[style*="line-height: 1.1"],[style*="line-height: 1.2"],[style*="line-height: 1.3"],[style*="line-height:1;"],[style*="line-height:1.0"],[style*="line-height:1.1"],[style*="line-height:1.2"],[style*="line-height:1.3"]):not(button):not(a):not(.pvh *):not([style*="nowrap"]){line-height:1.45 !important;}
</style>
</helmet>

<section dir="rtl" style="background:#F0F0F0;padding:clamp(24px,4vw,48px) clamp(16px,3vw,24px);min-height:100vh;display:flex;align-items:center;justify-content:center;">

  <div ref="{{ zoneRef }}" onMouseMove="{{ onMove }}" onTouchMove="{{ onTouch }}" style="position:relative;width:100%;max-width:1280px;background:#fff;border-radius:40px;box-shadow:0 2px 8px rgba(0,0,0,.04),0 24px 64px rgba(0,0,0,.06);padding:clamp(100px,16vw,220px) clamp(24px,5vw,80px);overflow:hidden;cursor:crosshair;">

    <!-- spawn layer (images appear here, behind content) -->
    <div ref="{{ layerRef }}" style="position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;border-radius:40px;"></div>

    <!-- content -->
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(32px,4vw,48px);pointer-events:none;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="width:8px;height:8px;border-radius:50%;background:#F50115;"></span>
        <span style="font-size:13px;font-weight:500;color:#910C07;">تواصل معنا</span>
      </div>

      <h2 style="margin:0;font-size:clamp(38px,6.4vw,84px);font-weight:700;line-height:1.08;color:#000;max-width:820px;">ابن السلامة<br>من البداية.</h2>

      <a class="pv-cta-pill" href="contact" style="pointer-events:auto;display:inline-flex;align-items:center;gap:14px;background:#000;color:#fff;padding:10px 30px 10px 12px;border-radius:46px;font-size:17px;font-weight:600;text-decoration:none;box-shadow:0 12px 32px rgba(0,0,0,.25);" style-hover="background:#910C07;">
        <img src="assets/brand/perfect-vision-badge.svg" alt="" style="width:40px;height:40px;border-radius:50%;display:block;">
        <span>اطلب عرضًا</span>
      </a>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900},
  &quot;spawnEvery&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 80, &quot;min&quot;: 40, &quot;max&quot;: 300, &quot;step&quot;: 10, &quot;unit&quot;: &quot;ms&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;التأثير&quot;},
  &quot;imageWidth&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 190, &quot;min&quot;: 120, &quot;max&quot;: 300, &quot;step&quot;: 10, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;التأثير&quot;},
  &quot;maxRotation&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 10, &quot;min&quot;: 0, &quot;max&quot;: 25, &quot;step&quot;: 1, &quot;unit&quot;: &quot;deg&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;التأثير&quot;},
  &quot;imageStyle&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;mono&quot;, &quot;options&quot;: [&quot;mono&quot;, &quot;natural&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;التأثير&quot;}
}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.images = [
      'assets/photos/perfect-vision-photo-excavator.webp',
      'assets/photos/perfect-vision-photo-fleet-row.webp',
      'assets/photos/perfect-vision-photo-truck-dust.webp',
      'assets/photos/perfect-vision-photo-worker-column.webp',
      'assets/fleetic/hero/fleetic-hero-truck-silhouette-blue.webp',
      'assets/products/shared/perfect-vision-monitor-display-7in.webp',
      'assets/photos/perfect-vision-photo-fleet-yard-aerial.webp',
      'assets/photos/perfect-vision-photo-earthworks-site.webp',
      'assets/photos/perfect-vision-photo-truck-row-bw.webp',
      'assets/photos/perfect-vision-photo-loader-night-bw.webp'
    ];
    this.idx = 0;
    this.lastTime = 0;
    this.images.forEach((s) => { const i = new Image(); i.src = s; });
    this.lastX = -999;
    this.lastY = -999;
  }

  spawn(clientX, clientY) {
    const zone = this.zone, layer = this.layer;
    if (!zone || !layer) return;

    const now = performance.now();
    const minGap = this.props.spawnEvery ?? 80;
    if (now - this.lastTime < minGap) return;

    const dx = clientX - this.lastX, dy = clientY - this.lastY;
    if (Math.hypot(dx, dy) < 24) return;

    this.lastTime = now;
    this.lastX = clientX;
    this.lastY = clientY;

    const rect = zone.getBoundingClientRect();
    const x = clientX - rect.left, y = clientY - rect.top;

    const w = this.props.imageWidth ?? 190;
    const maxRot = this.props.maxRotation ?? 10;
    const rot = (Math.random() * 2 - 1) * maxRot;
    const mono = (this.props.imageStyle ?? 'mono') === 'mono';

    const img = document.createElement('img');
    img.src = this.images[this.idx % this.images.length];
    this.idx++;

    img.style.cssText =
      'position:absolute;left:' + x + 'px;top:' + y + 'px;' +
      'width:' + w + 'px;height:' + Math.round(w * 0.72) + 'px;' +
      'object-fit:cover;border-radius:12px;pointer-events:none;background:#e8e8e8;' +
      'box-shadow:0 16px 40px rgba(0,0,0,.22);will-change:transform,opacity;' +
      (mono ? 'filter:grayscale(1) contrast(1.08);' : '');

    layer.appendChild(img);

    const anim = img.animate([
      { transform: 'translate(-50%,-50%) scale(.35) rotate(' + rot + 'deg)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scale(1) rotate(' + rot + 'deg)', opacity: 1, offset: 0.18 },
      { transform: 'translate(-50%,-50%) scale(1) rotate(' + rot + 'deg)', opacity: 1, offset: 0.45 },
      { transform: 'translate(-50%,-52%) scale(.7) rotate(' + rot + 'deg)', opacity: 0 }
    ], { duration: 1250, easing: 'cubic-bezier(.2,0,0,1)', fill: 'forwards' });

    anim.onfinish = () => img.remove();

    while (layer.children.length > 14) layer.firstChild.remove();
  }

  renderVals() {
    return {
      zoneRef: (el) => { this.zone = el; },
      layerRef: (el) => { this.layer = el; },
      onMove: (e) => this.spawn(e.clientX, e.clientY),
      onTouch: (e) => {
        const t = e.touches && e.touches[0];
        if (t) this.spawn(t.clientX, t.clientY);
      }
    };
  }
}
</script>
</body>
</html>
