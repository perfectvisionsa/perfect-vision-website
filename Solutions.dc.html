<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html{scroll-behavior:smooth;}
  body{font-family:'Readex Pro',sans-serif;background:#fff;color:#0a0a0a;overflow-x:hidden;}
  ::selection{background:#F50115;color:#fff;}
  a{text-decoration:none;color:inherit;}
  [data-reveal]{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1);}
  .pv-cta{transition:background .35s ease,color .35s ease,border-color .35s ease,transform .25s ease;}
  .liquid-glass{background:rgba(255,255,255,0.01);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden;}
  .liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-tile{transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s ease;}
  .pv-tile:hover{transform:translateY(-6px);box-shadow:0 30px 60px -28px rgba(0,0,0,.32);}
  .pv-tile:hover .pv-tile-img{transform:scale(1.07);}
  .pv-tile-img{transition:transform .7s cubic-bezier(.2,.7,.2,1);}
  .pv-desktop-only{display:inline-flex;}
  .pv-bento{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(16px,2vw,24px);grid-auto-rows:clamp(210px,25vw,330px);}
  .pv-bcol-7{grid-column:span 7;}
  .pv-bcol-5{grid-column:span 5;}
  .pv-bcol-4{grid-column:span 4;}
  .pv-bcard{position:relative;display:block;border-radius:24px;overflow:hidden;background:#0f0f0f;border:2px solid #E4E4E4;}
  .pv-bcard-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1);}
  .pv-bcard:hover .pv-bcard-img,.pv-bcard:focus-visible .pv-bcard-img,.pv-bcard.pv-touched .pv-bcard-img{transform:scale(1.05);}
  .pv-bcard-scrim{display:none;}
  .pv-bcard-name{position:absolute;bottom:16px;inset-inline-start:20px;color:#0a0a0a;font-size:13.5px;font-weight:500;text-shadow:none;}
  .pv-bcard-light .pv-bcard-scrim{display:none;}
  .pv-bcard-fit{background:#fff;}
  .pv-bcard-fit .pv-bcard-scrim{display:none;}
  .pv-bcard-fit .pv-bcard-name{color:#0a0a0a;text-shadow:none;}
  .pv-bcard-fit .pv-bcard-img{object-fit:contain;padding:clamp(16px,2.6vw,38px);}
  .pv-bcard-light .pv-bcard-name{color:#0a0a0a;text-shadow:none;}
  .pv-bcard-veil{position:absolute;inset:0;border-radius:inherit;overflow:hidden;display:flex;align-items:center;justify-content:center;opacity:0;background:rgba(10,10,10,.4);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .45s cubic-bezier(.2,.7,.2,1);}
  .pv-bcard:hover .pv-bcard-veil,.pv-bcard:focus-visible .pv-bcard-veil,.pv-bcard.pv-touched .pv-bcard-veil{opacity:1;}
  .pv-bcard-pill{position:relative;display:inline-flex;border-radius:44px;transform:translateY(10px);transition:transform .45s cubic-bezier(.2,.7,.2,1),background .3s ease;background:rgba(255,255,255,0.01);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,0.1),0 18px 44px -18px rgba(0,0,0,.55);overflow:hidden;}
  .pv-bcard-pill::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-bcard:hover .pv-bcard-pill,.pv-bcard:focus-visible .pv-bcard-pill,.pv-bcard.pv-touched .pv-bcard-pill{transform:translateY(0);}
  .pv-bcard-pill:hover{background:rgba(255,255,255,.14);}
  .pv-bcard-pill:active{transform:translateY(0) scale(.98);}
  .pv-bcard-pill-in{display:inline-flex;align-items:center;gap:10px;border-radius:inherit;padding:12px 26px;font-size:15px;color:#fff;background:transparent;white-space:nowrap;}
  .pv-allbtn{position:relative;border-radius:44px;background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);overflow:hidden;transition:background .3s ease;}
  .pv-allbtn::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-allbtn:hover{background:rgba(10,10,10,0.08);}
  .pv-allbtn-in{display:inline-flex;align-items:center;gap:10px;border-radius:inherit;background:transparent;color:#0a0a0a;padding:12px 26px;font-size:15px;font-weight:500;}
  .pv-arr{transition:transform .3s ease;}
  .pv-allbtn:hover .pv-arr{transform:translateX(4px);}
  [dir="rtl"] .pv-arr{transform:scaleX(-1);}
  [dir="rtl"] .pv-allbtn:hover .pv-arr{transform:scaleX(-1) translateX(4px);}
  @media(max-width:840px){
    .pv-desktop-only{display:none !important;}
    .pv-bcol-7,.pv-bcol-5,.pv-bcol-4{grid-column:1/-1;}
  }
  .pv-arc-fit img{object-fit:cover !important;object-position:center;padding:0;background:#fff;}
  .liquid-glass-dark{background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);position:relative;overflow:hidden;}
  .liquid-glass-dark::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-glass-card{background:rgba(255,255,255,0.55);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:none;position:relative;overflow:hidden;box-shadow:0 24px 60px -26px rgba(10,10,10,.28),inset 0 1px 1px rgba(255,255,255,.9);}
  .pv-glass-card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.35) 32%,rgba(10,10,10,.05) 72%,rgba(10,10,10,.12) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-stack-card{transform-origin:center top;will-change:transform;}
  /* pv-a11y-phase1 */
  a:focus-visible,button:focus-visible,[role="button"]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #F50115;outline-offset:3px;border-radius:6px;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}[data-reveal]{opacity:1 !important;transform:none !important;}}
  /* pv-ar-leading: Arabic (RTL) leading floor. Readex Pro bold/tight headings collide between lines; any bold or tight-leaded text gets >= 1.45 leading. Site-wide, do not remove. */
  [dir="rtl"] :is(h1,h2,h3,h4,h5,h6,strong,b,[style*="font-weight: 600"],[style*="font-weight: 700"],[style*="font-weight: 800"],[style*="font-weight: bold"],[style*="font-weight:600"],[style*="font-weight:700"],[style*="font-weight:800"],[style*="font-weight:bold"],[style*="line-height: 1;"],[style*="line-height: 1.0"],[style*="line-height: 1.1"],[style*="line-height: 1.2"],[style*="line-height: 1.3"],[style*="line-height:1;"],[style*="line-height:1.0"],[style*="line-height:1.1"],[style*="line-height:1.2"],[style*="line-height:1.3"]):not(button):not(a):not(.pvh *):not([style*="nowrap"]){line-height:1.45 !important;}
</style>
</helmet>
<div dir="{{ dir }}" style="font-family:'Readex Pro',sans-serif;">

  <dc-import name="SiteHeader" active="solutions" bar-mode="solid" hint-size="100%,80px"></dc-import>

  <!-- HERO / ARC ANIMATION -->
  <section data-pv-arc="" data-screen-label="Solutions Arc Hero" style="position:relative;height:100vh;min-height:620px;background:#fff;overflow:hidden;">
    <div data-arc-content="" style="position:absolute;top:clamp(120px,17vh,190px);left:0;right:0;z-index:4;text-align:center;pointer-events:none;padding:0 20px;">
      <h1 style="font-size:clamp(30px,4.6vw,64px);font-weight:700;line-height:1.04;margin-top:16px;color:#0a0a0a;text-wrap:balance;">{{ t.heroHead }}</h1>
      <p style="max-width:620px;margin:18px auto 0;font-size:clamp(15px,1.4vw,18px);font-weight:300;line-height:1.55;color:#555;">{{ t.heroSub }}</p>
    </div>
    <div style="position:absolute;inset:0;z-index:2;cursor:grab;touch-action:pan-y;">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="18">
        <div data-arc-card="" class="{{ c.cls }}" aria-hidden="true" style="position:absolute;left:50%;top:50%;width:90px;height:90px;opacity:0;will-change:transform;display:block;pointer-events:none;">
          <div style="position:absolute;inset:0;border-radius:10px;overflow:hidden;background:#F0F0F0;box-shadow:0 14px 30px -14px rgba(10,10,10,.35);">
            <img src="{{ c.img }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section class="pv-family" style="background:#F4F4F4;color:#111;padding:clamp(80px,10vw,150px) clamp(20px,6vw,80px);">
    <div style="max-width:1240px;margin:0 auto;">
      <div data-reveal="" style="display:flex;flex-wrap:wrap;align-items:end;justify-content:center;gap:24px;text-align:center;">
        <div>
          <h2 style="margin:0;font-size:clamp(30px,4.4vw,58px);font-weight:700;line-height:1.04;">{{ t.familyTitleA }} <span style="font-weight:200;">{{ t.familyTitleB }}</span></h2>
        </div>
      </div>
      <div class="pv-bento" style="margin-top:clamp(40px,5vw,60px);">
        <sc-for list="{{ products }}" as="p" hint-placeholder-count="6">
          <a class="pv-bcard {{ p.cls }}" href="{{ p.href }}" data-reveal="" data-reveal-delay="{{ p.delay }}">
            <img class="pv-bcard-img" src="{{ p.img }}" loading="lazy" alt="{{ p.name }}">
            <div class="pv-bcard-scrim" aria-hidden="true"></div>
            <div class="pv-bcard-name">{{ p.name }}</div>
            <div class="pv-bcard-veil">
              <span class="pv-bcard-pill">
                <span class="pv-bcard-pill-in"><span style="font-weight:200;">{{ t.familyView }}</span><span style="font-weight:600;">{{ p.name }}</span></span>
              </span>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </section>

  <!-- SECTORS (moved from About) -->
  <section data-stack-section="" data-screen-label="Sectors stack" style="position:relative;z-index:5;background:linear-gradient(180deg,#eceef2 0%,#f5f6f8 46%,#e9ebef 100%);color:#0a0a0a;padding:clamp(120px,10vw,160px) clamp(20px,6vw,80px) clamp(50px,6vw,100px);">
    <div style="max-width:1240px;margin:0 auto;">

      <h2 style="margin-top:16px;font-size:clamp(30px,4.4vw,58px);font-weight:700;line-height:1.35;padding-bottom:.1em;text-wrap:balance;color:#0a0a0a;">{{ t.stackHead }}</h2>
      <p style="margin-top:16px;max-width:1100px;font-size:15px;font-weight:300;line-height:1.6;color:#666;">{{ t.intro }}</p>

      <div data-stack-parent="" style="margin-top:clamp(18px,2vw,28px);position:relative;">
        <sc-for list="{{ industries }}" as="ind" hint-placeholder-count="4">
          <div style="position:sticky;top:0;height:100vh;display:flex;align-items:flex-start;padding-top:{{ ind.stickTop }};">
            <div class="pv-stack-card pv-glass-card" data-stack-card="" data-screen-label="{{ ind.title }}" style="width:100%;height:clamp(560px,calc(100vh - 150px),920px);overflow:hidden;color:#0a0a0a;border-radius:24px;padding:clamp(18px,2.6vw,34px);display:flex;flex-direction:column;gap:clamp(16px,2.2vw,28px);">

              <div style="flex-shrink:0;display:flex;align-items:flex-start;gap:clamp(16px,2.6vw,36px);flex-wrap:wrap;">
                <div style="flex:1 1 0;min-width:0;">
                  <h3 style="font-size:clamp(30px,3.8vw,54px);font-weight:700;line-height:1.02;">{{ ind.title }}</h3>
                  <p style="margin-top:12px;max-width:none;min-height:3.3em;font-size:15.5px;font-weight:300;line-height:1.65;color:rgba(10,10,10,.72);">{{ ind.desc }}</p>
                </div>
                <div style="flex-shrink:0;display:flex;flex-direction:column;gap:10px;align-items:stretch;">
                  <a class="pv-cta liquid-glass-dark" href="{{ ind.firstHref }}" style="border-radius:44px;padding:15px 32px;font-size:13px;font-weight:500;color:#0a0a0a;text-align:center;" style-hover="background:rgba(10,10,10,.08);">{{ ind.exploreFirst }}</a>
                  <a class="pv-cta liquid-glass-dark" href="{{ ind.secondHref }}" style="border-radius:44px;padding:15px 32px;font-size:13px;font-weight:500;color:#0a0a0a;text-align:center;" style-hover="background:rgba(10,10,10,.08);">{{ ind.exploreSecond }}</a>
                </div>
              </div>

              <div style="flex:1;min-height:0;display:grid;grid-template-columns:{{ ind.gCols }};grid-template-rows:{{ ind.gRows }};gap:clamp(10px,1.4vw,18px);">
                <div style="grid-column:{{ ind.c1 }};grid-row:{{ ind.r1 }};position:relative;overflow:hidden;border-radius:18px;background:#f0f0f0;">
                  <img src="{{ ind.img1 }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;">
                </div>
                <div style="grid-column:{{ ind.c2 }};grid-row:{{ ind.r2 }};position:relative;overflow:hidden;border-radius:18px;background:#f0f0f0;">
                  <img src="{{ ind.img2 }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;">
                </div>
                <div style="grid-column:{{ ind.c3 }};grid-row:{{ ind.r3 }};position:relative;overflow:hidden;border-radius:18px;background:#f0f0f0;">
                  <img src="{{ ind.img3 }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;display:block;">
                </div>
              </div>

            </div>
          </div>
        </sc-for>
      </div>

    </div>
  </section>


  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let lang = 'en';
    try { lang = localStorage.getItem('pv-lang') || 'en'; } catch (e) {}
    this.state = { lang };
  }
  componentDidMount() {
    this._onLang = (e) => this.setState({ lang: e.detail }); window.addEventListener('pv-langchange', this._onLang); this.initReveal(); this.initArc();
    this._reduced = false; try { this._reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    this._stackScroll = () => { if (this._stackRaf) return; this._stackRaf = requestAnimationFrame(() => { this._stackRaf = null; this.updateStack(); }); };
    window.addEventListener('scroll', this._stackScroll, { passive: true });
    window.addEventListener('resize', this._stackScroll);
    this.updateStack();
  }
  componentDidUpdate() { this.initReveal(); this.updateStack(); }
  componentWillUnmount() {
    window.removeEventListener('pv-langchange', this._onLang); if (this._io) this._io.disconnect();
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._arcIo) this._arcIo.disconnect(); if (this._arcSync) document.removeEventListener('visibilitychange', this._arcSync);
    if (this._stackScroll) { window.removeEventListener('scroll', this._stackScroll); window.removeEventListener('resize', this._stackScroll); }
    if (this._stackRaf) cancelAnimationFrame(this._stackRaf);
    window.removeEventListener('wheel', this._onArcWheel); window.removeEventListener('pointerdown', this._onArcDown);
    window.removeEventListener('pointermove', this._onArcMove); window.removeEventListener('pointerup', this._onArcUp);
    window.removeEventListener('pointercancel', this._onArcUp);
  }
  initArc() {
    if (this._A) return;
    const RM = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
    const A = this._A = { rm: RM, off: 0, vel: 0, drag: null, px: 0, py: 0, arcR: 900, t0: performance.now(), last: performance.now() };
    const deg = (px) => px * 180 / (Math.PI * (A.arcR || 900));
    const inArc = (e) => e.target && e.target.closest && e.target.closest('[data-pv-arc]');
    this._onArcWheel = (e) => {
      if (!inArc(e) || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
      e.preventDefault(); A.vel = 0; A.off -= deg(e.deltaX);
    };
    this._onArcDown = (e) => { if (!inArc(e)) return; A.drag = 'maybe'; A.px = e.clientX; A.py = e.clientY; A.vel = 0; };
    this._onArcMove = (e) => {
      if (!A.drag) return;
      const dx = e.clientX - A.px, dy = e.clientY - A.py;
      if (A.drag === 'maybe') {
        if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) { A.drag = null; return; }
        if (Math.abs(dx) < 4) return;
        A.drag = true;
      }
      A.px = e.clientX; A.py = e.clientY;
      const d = deg(dx); A.off += d; A.vel = d * .7;
    };
    this._onArcUp = () => { A.drag = null; };
    window.addEventListener('wheel', this._onArcWheel, { passive: false });
    window.addEventListener('pointerdown', this._onArcDown, { passive: true });
    window.addEventListener('pointermove', this._onArcMove, { passive: true });
    window.addEventListener('pointerup', this._onArcUp, { passive: true });
    window.addEventListener('pointercancel', this._onArcUp, { passive: true });
    const tick = () => { this._raf = requestAnimationFrame(tick); this.arcFrame(A); };
    const gateEl = document.querySelector('[data-pv-arc]');
    const runLoop = () => { if (!this._raf) { A.last = performance.now(); this._raf = requestAnimationFrame(tick); } };
    const haltLoop = () => { if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; } };
    this._arcSync = () => { (this._arcVis && !document.hidden) ? runLoop() : haltLoop(); };
    if (gateEl && 'IntersectionObserver' in window) {
      this._arcVis = false;
      this._arcIo = new IntersectionObserver((es) => { this._arcVis = es[0].isIntersecting; this._arcSync(); }, { rootMargin: '200px' });
      this._arcIo.observe(gateEl);
      document.addEventListener('visibilitychange', this._arcSync);
    } else { this._arcVis = true; runLoop(); }
  }
  arcFrame(A) {
    const sec = document.querySelector('[data-pv-arc]'); if (!sec) return;
    const cards = sec.querySelectorAll('[data-arc-card]'); const n = cards.length; if (!n) return;
    const W = sec.clientWidth, H = sec.clientHeight;
    const now = performance.now(), dt = Math.min((now - A.last) / 1000, .05); A.last = now;
    const isMob = W < 768;
    const total = isMob ? 150 : 170;
    if (A.drag !== true) {
      if (!A.rm) A.off += dt * (isMob ? 3.4 : 2.6);
      A.off += A.vel; A.vel *= .93; if (Math.abs(A.vel) < .002) A.vel = 0;
    }
    A.off = ((A.off % total) + total) % total;
    const arcR = Math.min(W, H * 1.5) * (isMob ? 1.4 : 1.1); A.arcR = arcR;
    const arcCY = H * (isMob ? .70 : .64) - H / 2 + arcR;
    const start = -90 - total / 2, step = total / n, s = isMob ? 1.5 : 1.9;
    const fade = Math.min((now - A.t0) / 800, 1);
    for (let i = 0; i < n; i++) {
      const aa = start + ((i * step + A.off) % total), ar = aa * Math.PI / 180;
      const x = Math.cos(ar) * arcR, y = Math.sin(ar) * arcR + arcCY;
      cards[i].style.transform = 'translate(-50%,-50%) translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) rotate(' + (aa + 90).toFixed(2) + 'deg) scale(' + s + ')';
      cards[i].style.opacity = fade.toFixed(3);
    }
  }
