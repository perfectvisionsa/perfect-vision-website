<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html{scroll-behavior:smooth;}
  body{font-family:'Readex Pro',sans-serif;background:#F0F0F0;color:#0a0a0a;overflow-x:hidden;}
  ::selection{background:#F50115;color:#fff;}
  a{text-decoration:none;color:inherit;}
  a:hover{color:#F50115;}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);}
  .pv-allbtn{position:relative;border-radius:44px;background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);overflow:hidden;transition:background .3s ease;}
  .pv-allbtn::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-allbtn:hover{background:rgba(10,10,10,0.08);}
  .pv-allbtn-in{display:inline-flex;align-items:center;gap:10px;border-radius:inherit;background:transparent;color:#0a0a0a;padding:12px 26px;font-size:15px;font-weight:500;}
  .pv-arr{transition:transform .3s ease;}
  .pv-arr-back{transition:translate .3s ease;}
  .pv-allbtn:hover .pv-arr-back{translate:-4px 0;}
  [dir="rtl"] .pv-arr-back{transform:scaleX(-1);}
  [dir="rtl"] .pv-allbtn:hover .pv-arr-back{translate:4px 0;}
  .pv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;}
  @media(max-width:1000px){.pv-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;}}
  @media(max-width:640px){.pv-grid{grid-template-columns:1fr;}}
  .pv-card:hover .pv-card-img{transform:scale(1.05);}
  .pv-card-img{transition:transform .7s cubic-bezier(.2,.7,.2,1);}
  .pv-clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  /* pv-a11y-phase1 */
  a:focus-visible,button:focus-visible,[role="button"]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #F50115;outline-offset:3px;border-radius:6px;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}[data-reveal]{opacity:1 !important;transform:none !important;}}
  /* pv-ar-leading: Arabic (RTL) leading floor. Readex Pro bold/tight headings collide between lines; any bold or tight-leaded text gets >= 1.45 leading. Site-wide, do not remove. */
  [dir="rtl"] :is(h1,h2,h3,h4,h5,h6,strong,b,[style*="font-weight: 600"],[style*="font-weight: 700"],[style*="font-weight: 800"],[style*="font-weight: bold"],[style*="font-weight:600"],[style*="font-weight:700"],[style*="font-weight:800"],[style*="font-weight:bold"],[style*="line-height: 1;"],[style*="line-height: 1.0"],[style*="line-height: 1.1"],[style*="line-height: 1.2"],[style*="line-height: 1.3"],[style*="line-height:1;"],[style*="line-height:1.0"],[style*="line-height:1.1"],[style*="line-height:1.2"],[style*="line-height:1.3"]):not(button):not(a):not(.pvh *):not([style*="nowrap"]){line-height:1.45 !important;}
</style>
</helmet>
<div dir="{{ dir }}" style="font-family:'Readex Pro',sans-serif;background:#F0F0F0;">

  <dc-import name="SiteHeader" active="newsroom" bar-mode="solid" hint-size="100%,80px"></dc-import>

  <section data-screen-label="Blogs" style="background:#F0F0F0;color:#0a0a0a;padding:clamp(120px,15vh,175px) clamp(20px,6vw,80px) clamp(70px,9vw,120px);">
    <div style="max-width:1240px;margin:0 auto;">

      <div data-reveal style="padding-bottom:clamp(24px,3vw,38px);border-bottom:1px solid #DEDEDE;">
        <a class="pv-allbtn" href="Newsroom.dc.html" style="display:inline-block;">
          <span class="pv-allbtn-in" style="color:#111;"><svg class="pv-arr-back" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>{{ t.back }}</span>
        </a>
        <h1 style="font-size:clamp(32px,5vw,64px);font-weight:700;line-height:1.06;margin-top:26px;">{{ t.title }}</h1>
        <p style="margin-top:14px;max-width:620px;font-size:clamp(15px,1.4vw,17px);font-weight:300;line-height:1.65;color:#666;">{{ t.sub }}</p>
      </div>

      <div class="pv-grid" style="margin-top:clamp(30px,4vw,48px);">
        <sc-for list="{{ posts }}" as="p" hint-placeholder-count="9">
          <a class="pv-card" href="{{ p.href }}" data-reveal style="aspect-ratio:3/4.05;border-radius:22px;overflow:hidden;position:relative;display:block;background:#161616;">
            <img class="pv-card-img" src="{{ p.img }}" loading="lazy" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ p.pos }};" />
            <div style="position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;background:{{ p.scrim }};"></div>
            <sc-if value="{{ p.hasLogo }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(closest-side at 50% 45%,rgba(255,255,255,.86) 0%,rgba(255,255,255,.5) 55%,rgba(255,255,255,0) 100%);">
                <img src="{{ p.logo }}" alt="Saudi Aramco" style="width:58%;max-width:190px;height:auto;display:block;filter:drop-shadow(0 2px 8px rgba(255,255,255,.6));" />
              </div>
            </sc-if>
            <div style="position:absolute;left:0;right:0;bottom:0;padding:20px;">
              <h3 class="pv-clamp2" style="color:{{ p.ink }};font-size:20px;font-weight:600;line-height:1.25;">{{ p.title }}</h3>
              <div style="display:flex;align-items:center;gap:10px;margin-top:10px;"><span style="font-size:11px;font-weight:600;color:{{ p.chipInk }};background:{{ p.chipBg }};padding:3px 10px;border-radius:20px;">{{ p.cat }}</span><span style="color:{{ p.inkSoft }};font-size:12.5px;">{{ p.date }}</span></div>
            </div>
          </a>
        </sc-for>
      </div>

    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let lang = 'en';
    try { lang = localStorage.getItem('pv-lang') || 'en'; } catch (e) {}
    this.state = { lang };
  }
  componentDidMount() {
    this._onLang = (e) => this.setState({ lang: e.detail });
    window.addEventListener('pv-langchange', this._onLang);
    this.initReveal();
  }
  componentDidUpdate() { this.initReveal(); }
  componentWillUnmount() {
    window.removeEventListener('pv-langchange', this._onLang);
    if (this._io) this._io.disconnect();
  }
  measureTone(src) {
    if (!src) return;
    this._tones = this._tones || {};
    if (src in this._tones) return;
    this._tones[src] = null;
    const img = new Image();
    img.onload = () => {
      try {
        const W = 24, H = 12, c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, Math.round(img.naturalHeight * 0.58), img.naturalWidth, Math.round(img.naturalHeight * 0.42), 0, 0, W, H);
        const d = ctx.getImageData(0, 0, W, H).data;
        let sum = 0, n = 0;
        for (let k = 0; k < d.length; k += 4) { sum += 0.2126 * d[k] + 0.7152 * d[k + 1] + 0.0722 * d[k + 2]; n++; }
        this._tones[src] = (sum / n) > 150 ? 'light' : 'dark';
      } catch (e) { this._tones[src] = 'dark'; }
      this.forceUpdate();
    };
    img.onerror = () => { this._tones[src] = 'dark'; };
    img.src = src;
  }
  initReveal() {
    if (!('IntersectionObserver' in window)) { document.querySelectorAll('[data-reveal]').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; }); return; }
    if (!this._io) this._io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'translateY(0)'; this._io.unobserve(e.target); } }), { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });
    document.querySelectorAll('[data-reveal]').forEach(el => { if (!el._o) { el._o = true; this._io.observe(el); } });
  }
  renderVals() {
    const isAr = this.state.lang === 'ar';
    const ISO = 'assets/news/perfect-vision-news-iso-certification-portrait.webp', BRAND = 'assets/news/perfect-vision-news-brand-launch-portrait.webp';
    const MEGA = 'assets/photos/perfect-vision-photo-megaproject-aerial.webp', YARD = 'assets/photos/perfect-vision-photo-fleet-yard-aerial.webp', HIGH = 'assets/photos/perfect-vision-photo-highrise-site-topdown.webp';
    const DEMO = 'assets/photos/perfect-vision-photo-construction-site-aerial.webp', GAS = 'assets/photos/perfect-vision-photo-crew-gas-plant.webp', CONS = 'assets/photos/perfect-vision-photo-earthworks-site.webp';
    const TVU = 'assets/products/trackview/perfect-vision-trackview-plus-unit.jpg', AVU = 'assets/products/airview/perfect-vision-airview-station-angle.webp';
    const ARAMCO = 'assets/clients/client-logo-saudi-aramco.png';
    const en = {
      back: 'Back to Newsroom', title: 'The Blog', sub: 'News from the field and articles on industrial safety, from the site to the control room.',
      news: [
        { img: BRAND, cat: 'News', date: '8 Jul 2026', title: 'New mark. New era. Same promise.', href: 'Article-Brand.dc.html' },
        { img: ISO, cat: 'News', date: '1 Jul 2026', title: 'Three ISO certificates. One discipline.', href: 'Article-ISO.dc.html' },
        { img: MEGA, cat: 'News', date: '27 Apr 2026', title: 'Perfect Vision crosses 500 connected facilities' },
        { img: AVU, cat: 'News', date: '19 Apr 2026', title: 'AirView goes live at a SABIC complex' },
        { img: YARD, cat: 'News', date: '22 Jan 2026', title: 'ProxView rollout across a NEOM logistics corridor' },
        { img: HIGH, cat: 'News', date: '1 Jan 2026', title: 'LiftView retrofitted across an Eastern Province crane fleet' },
        { img: TVU, cat: 'News', date: '3 Nov 2025', title: 'TrackView goes live across a national logistics fleet' }
      ],
      blogs: [
        { img: DEMO, logo: ARAMCO, href: 'Article-ProxView-Aramco.dc.html', date: '25 Feb 2026', title: 'Why ProxView meets Aramco-approved safety requirements' },
        { img: CONS, pos: '68% center', href: 'Article-Vision2030.dc.html', date: '22 Oct 2025', title: 'Digital transformation is rewriting construction safety in the Kingdom' },
        { img: GAS, href: 'Article-AirView.dc.html', date: '25 Aug 2025', title: 'Why the Kingdom is monitoring the air, from cities to worksites' }
      ]
    };
    const ar = {
      back: 'العودة إلى الأخبار', title: 'المدونة', sub: 'أخبار من الميدان ومقالات حول السلامة الصناعية، من الموقع إلى غرفة التحكم.',
      news: [
        { img: BRAND, cat: 'أخبار', date: '8 Jul 2026', title: 'شعار جديد. مرحلة جديدة. الوعد نفسه.', href: 'Article-Brand.dc.html' },
        { img: ISO, cat: 'أخبار', date: '1 Jul 2026', title: 'ثلاث شهادات آيزو. منهجية واحدة.', href: 'Article-ISO.dc.html' },
        { img: MEGA, cat: 'أخبار', date: '27 Apr 2026', title: 'Perfect Vision تتجاوز 500 منشأة متصلة' },
        { img: AVU, cat: 'أخبار', date: '19 Apr 2026', title: 'AirView يبدأ العمل في مجمع سابك' },
        { img: YARD, cat: 'أخبار', date: '22 Jan 2026', title: 'تركيب ProxView على ممر لوجستي في نيوم' },
        { img: HIGH, cat: 'أخبار', date: '1 Jan 2026', title: 'LiftView على أسطول رافعات الشرقية' },
        { img: TVU, cat: 'أخبار', date: '3 Nov 2025', title: 'TrackView يدخل الخدمة على أسطول لوجستي وطني' }
      ],
      blogs: [
        { img: DEMO, logo: ARAMCO, href: 'Article-ProxView-Aramco.dc.html', date: '25 Feb 2026', title: 'لماذا يستوفي ProxView متطلبات السلامة المعتمدة من أرامكو' },
        { img: CONS, pos: '68% center', href: 'Article-Vision2030.dc.html', date: '22 Oct 2025', title: 'التحول الرقمي يعيد كتابة سلامة الإنشاءات في المملكة' },
        { img: GAS, href: 'Article-AirView.dc.html', date: '25 Aug 2025', title: 'لماذا تراقب المملكة الهواء، من المدن إلى مواقع العمل' }
      ]
    };
    const t = isAr ? ar : en;
    const mon = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
    const dv = (d) => { const p = (d || '').split(' '); return new Date(+p[2] || 0, mon[(p[1] || '').toUpperCase()] || 0, +p[0] || 1).getTime(); };
    const merged = t.news.concat(t.blogs.map(b => Object.assign({}, b, { cat: isAr ? 'مقال' : 'Article' })))
      .sort((a, b) => dv(b.date) - dv(a.date));
    const posts = merged.map((p, idx) => {
      this.measureTone(p.img);
      const tone = (this._tones || {})[p.img] === 'light' ? 'light' : 'dark';
      return Object.assign({}, p, {
        key: 'p' + idx,
        href: p.href || 'Article.dc.html',
        pos: p.pos || 'center',
        hasLogo: !!p.logo,
        scrim: tone === 'light'
          ? 'linear-gradient(0deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.72) 45%,rgba(255,255,255,0) 100%)'
          : 'linear-gradient(0deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.5) 45%,rgba(0,0,0,0) 100%)',
        ink: tone === 'light' ? '#0a0a0a' : '#fff',
        inkSoft: tone === 'light' ? 'rgba(10,10,10,.72)' : 'rgba(255,255,255,.86)',
        chipInk: tone === 'light' ? '#0a0a0a' : '#fff',
        chipBg: tone === 'light' ? 'rgba(10,10,10,.10)' : 'rgba(255,255,255,.22)'
      });
    });
    return { dir: isAr ? 'rtl' : 'ltr', t, posts };
  }
}
</script>
</body>
</html>
