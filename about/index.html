<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<title>About - Perfect Vision</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="image-slot.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html{scroll-behavior:smooth;}
  body{font-family:'Readex Pro',sans-serif;background:#fff;color:#0a0a0a;overflow-x:hidden;}
  ::selection{background:#F50115;color:#fff;}
  a{text-decoration:none;color:inherit;}
  [data-reveal]{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1);}
  [data-stat-label]{filter:blur(14px);opacity:0;transform:translateY(16px);transition:filter 1.05s cubic-bezier(.16,1,.3,1),opacity 1.05s cubic-bezier(.16,1,.3,1),transform 1.05s cubic-bezier(.16,1,.3,1);}
  .pv-cta{transition:background .35s ease,color .35s ease,border-color .35s ease,transform .25s ease;}
  .liquid-glass{background:rgba(255,255,255,0.01);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden;}
  .liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .liquid-glass-dark{background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);position:relative;overflow:hidden;}
  .liquid-glass-dark::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-glass-card{background:rgba(255,255,255,0.55);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:none;position:relative;overflow:hidden;box-shadow:0 24px 60px -26px rgba(10,10,10,.28),inset 0 1px 1px rgba(255,255,255,.9);}
  .pv-glass-card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.35) 32%,rgba(10,10,10,.05) 72%,rgba(10,10,10,.12) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-stack-card{transform-origin:center top;will-change:transform;}
  .pv-marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);}
  .pv-marquee-track{display:flex;align-items:center;width:max-content;animation:pvMarquee 30s linear infinite;}
  .pv-marquee:hover .pv-marquee-track{animation-play-state:paused;}
  .pv-logo{height:clamp(42px,4.6vw,66px);width:auto;flex:none;margin:0 clamp(40px,5.6vw,84px);transition:transform .4s ease;}
  .pv-logo:hover{transform:scale(1.06);}
  @keyframes pvMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  /* principles pinned scrub */
  @media (max-width:767px){[data-vp-num]{position:static !important;margin:0 0 10px !important;font-size:76px !important;transform:none !important;}}
  /* certificates parallax */
  [data-cert-card]:hover{transform:rotate(0deg) scale(1.04) !important;box-shadow:0 44px 96px -34px rgba(0,0,0,.5) !important;z-index:3;}
  @media (max-width:767px){[data-cert-sec]{height:230vh !important;}[data-cert-grid]{grid-template-columns:1fr !important;width:min(78vw,330px) !important;column-gap:0 !important;}}
  /* leadership team */
  [data-team-card] image-slot{filter:grayscale(1);transition:filter .6s cubic-bezier(.2,0,0,1);}
  [data-team-card]:hover image-slot,[data-team-card]:focus-within image-slot{filter:grayscale(0);}
  [data-team-scrim]{opacity:0;transition:opacity .5s cubic-bezier(.2,0,0,1);}
  [data-team-info]{opacity:0;transform:translateY(18px);transition:opacity .45s cubic-bezier(.2,0,0,1),transform .45s cubic-bezier(.2,0,0,1);}
  [data-team-card]:hover [data-team-scrim],[data-team-card]:focus-within [data-team-scrim]{opacity:1;}
  [data-team-card]:hover [data-team-info],[data-team-card]:focus-within [data-team-info]{opacity:1;transform:translateY(0);}
  @media (hover:none){[data-team-scrim]{opacity:1;}[data-team-info]{opacity:1;transform:none;}[data-team-card] image-slot{filter:grayscale(1);}}
  .pv-tcard{flex:0 0 calc((100% - 72px)/4);}
  @media(max-width:1200px){.pv-tcard{flex:0 0 calc((100% - 48px)/3);}}
  @media(max-width:1000px){.pv-tcard{flex:0 0 calc((100% - 24px)/2);}}
  @media(max-width:640px){.pv-tcard{flex:0 0 100%;}}
  .pr-arrow{width:44px;height:44px;border-radius:50%;border:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#0a0a0a;font-size:18px;line-height:1;transition:background .3s ease,color .3s ease,border-color .3s ease,transform .25s ease,opacity .3s ease;}
  .pr-arrow:hover{background:#F50115;color:#fff;}
  [dir="rtl"] .pr-arrow{transform:scaleX(-1);}
  .pr-arrow-glassdark{position:relative;background:rgba(10,10,10,0.04);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,0.5),0 6px 18px -8px rgba(10,10,10,.28);}
  .pr-arrow-glassdark::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.28) 0%,rgba(10,10,10,0.1) 22%,rgba(10,10,10,0) 42%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.12) 82%,rgba(10,10,10,0.3) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
  .pr-arrow-glassdark:hover{background:#F50115;}
  .pr-arrow-glassdark:hover::before{opacity:0;}
  .pv-allbtn{position:relative;border-radius:44px;background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);overflow:hidden;transition:background .3s ease;}
  .pv-allbtn::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-allbtn:hover{background:rgba(10,10,10,0.08);}
  .pv-carr{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s ease,opacity .3s ease;}
  .pv-carr svg{transition:transform .3s ease;flex:none;}
  .pv-carr-next:hover svg{transform:translateX(3px);}
  .pv-carr-prev svg{transform:scaleX(-1);}
  .pv-carr-prev:hover svg{transform:scaleX(-1) translateX(3px);}
  [dir="rtl"] .pv-carr-next svg{transform:scaleX(-1);}
  [dir="rtl"] .pv-carr-next:hover svg{transform:scaleX(-1) translateX(3px);}
  [dir="rtl"] .pv-carr-prev svg{transform:none;}
  [dir="rtl"] .pv-carr-prev:hover svg{transform:translateX(3px);}
  [data-vp-num]{right:clamp(20px,6vw,80px);left:auto;}
  [dir="rtl"] [data-vp-num]{left:clamp(20px,6vw,80px);right:auto;}
  /* pv-a11y-phase1 */
  a:focus-visible,button:focus-visible,[role="button"]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #F50115;outline-offset:3px;border-radius:6px;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}[data-reveal]{opacity:1 !important;transform:none !important;}[data-stat-label]{filter:none !important;opacity:1 !important;transform:none !important;}.pv-stack-card{transform:none !important;}[data-w]{opacity:1 !important;}}
  /* pv-ar-leading: Arabic (RTL) leading floor. Readex Pro bold/tight headings collide between lines; any bold or tight-leaded text gets >= 1.45 leading. Site-wide, do not remove. */
  [dir="rtl"] :is(h1,h2,h3,h4,h5,h6,strong,b,[style*="font-weight: 600"],[style*="font-weight: 700"],[style*="font-weight: 800"],[style*="font-weight: bold"],[style*="font-weight:600"],[style*="font-weight:700"],[style*="font-weight:800"],[style*="font-weight:bold"],[style*="line-height: 1;"],[style*="line-height: 1.0"],[style*="line-height: 1.1"],[style*="line-height: 1.2"],[style*="line-height: 1.3"],[style*="line-height:1;"],[style*="line-height:1.0"],[style*="line-height:1.1"],[style*="line-height:1.2"],[style*="line-height:1.3"]):not(button):not(a):not(.pvh *):not([style*="nowrap"]){line-height:1.45 !important;}
</style>
</helmet>
<div dir="{{ dir }}" style="font-family:'Readex Pro',sans-serif;">

  <dc-import name="SiteHeader" active="about" hint-size="100%,80px"></dc-import>

  <!-- HERO -->
  <section style="position:relative;min-height:76vh;display:flex;align-items:center;overflow:hidden;padding:150px clamp(20px,6vw,80px) 90px;color:#fff;">
    <img src="assets/heroes/perfect-vision-hero-about-dammam-sails.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;">
    <div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.34) 34%,rgba(0,0,0,.06) 62%,transparent 82%);"></div>
    <div style="position:relative;z-index:2;max-width:1240px;margin:0 auto;width:100%;">
      <h1 data-reveal="" style="font-size: 57px; font-weight: 900; line-height: 1.1;  width: auto; height: auto; text-align: start; text-wrap: balance">{{ t.heroHead }}</h1>
    </div>
  </section>

  <!-- STORY -->
  <section style="background:#fff;padding:clamp(80px,11vw,160px) clamp(20px,6vw,80px);">
    <div style="max-width:1240px;margin:0 auto;">
      <p data-reveal="" style="font-size:clamp(20px,2.4vw,30px);font-weight:300;line-height:1.55;color:#1a1a1a;">{{ t.story1 }}</p>
      <p data-reveal="" data-reveal-delay="100" style="margin-top:32px;font-size:clamp(16px,1.5vw,19px);font-weight:300;line-height:1.7;color:#555;">{{ t.story2 }}</p>
    </div>
  </section>

  <!-- STATS -->
  <section id="pv-stats" style="background:#000;color:#fff;padding:clamp(70px,9vw,120px) clamp(20px,6vw,80px);">
    <div style="max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(28px,4vw,56px);">
      <sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
        <div data-stat-cell="" style="text-align:center;">
          <div data-stat-num="" data-count-to="{{ s.num }}" data-count-prefix="{{ s.prefix }}" data-count-suffix="{{ s.suffix }}" data-count-pad="{{ s.pad }}" style="text-align:center;font-family:'Readex Pro',sans-serif;font-size:clamp(44px,5vw,68px);font-weight:600;color:#F50115;background:linear-gradient(180deg,#FF3D4E 0%,#F50115 55%,#910C07 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums;line-height:1.1;" dir="ltr">{{ s.value }}</div>
          <div data-stat-label="" style="margin:10px auto 0;max-width:260px;font-size:15px;font-weight:300;color:#aaa;line-height:1.5;text-align:center;text-wrap:balance;">{{ s.label }}</div>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- CLIENTS (copied verbatim from Home trust bar) -->
  <section style="background:#fff;padding:clamp(48px,6vw,76px) clamp(20px,6vw,80px);border-bottom:1px solid #eee;">
    <div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; flex-direction: column; align-items: center; justify-content: center; gap: 28px; width: 100%; height: auto; position: static" data-reveal="">
      <div style="font-family: 'Readex Pro',sans-serif; font-size: clamp(16px,1.5vw,20px); font-weight: 700;   color: #111; line-height: 1.5; text-align: center">{{ t.trustLabel }}</div><div class="pv-marquee" style="width:100%;min-width:240px;">
        <div class="pv-marquee-track">
          <sc-for list="{{ clients }}" as="c" hint-placeholder-count="4">
            <img class="pv-logo" src="{{ c.logo }}" loading="lazy" alt="{{ c.name }}" style="height:calc(clamp(42px,4.6vw,66px) * {{ c.scale }});">
          </sc-for>
          <sc-for list="{{ clients }}" as="c" hint-placeholder-count="4">
            <img class="pv-logo" src="{{ c.logo }}" loading="lazy" alt="" aria-hidden="true" style="height:calc(clamp(42px,4.6vw,66px) * {{ c.scale }});">
          </sc-for>
        </div>
      </div>
    </div>
  </section>

  <!-- VALUES / PRINCIPLES — cinematic pinned horizontal scrub -->
  <section id="pv-vals" data-screen-label="Principles" style="position:relative;height:340vh;background:#F0F0F0;">
    <div id="pv-vals-sticky" style="position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:clamp(30px,6vh,60px);color:#0a0a0a;">
      <div style="position:relative;z-index:2;max-width:calc(1240px + 2 * clamp(20px,6vw,80px));margin:0 auto;width:100%;padding:0 clamp(20px,6vw,80px);">
        <h2 data-reveal="" style="font-size:clamp(28px,4vw,56px);font-weight:700;line-height:1.23;text-wrap:balance;color:#0a0a0a;">{{ t.valuesTitle }}</h2>
        <div style="position:relative;height:2px;background:rgba(10,10,10,.12);margin-top:clamp(26px,4vh,44px);">
          <div id="pv-vals-line" style="position:absolute;top:0;inset-inline-start:0;height:100%;width:0%;background:#F50115;box-shadow:0 0 14px rgba(245,1,21,.35);"></div>
        </div>
        <div style="display:flex;justify-content:space-between;gap:12px;margin-top:14px;">
          <sc-for list="{{ values }}" as="v" hint-placeholder-count="3">
            <button data-vals-marker="" onClick="{{ v.jump }}" style="display:flex;align-items:center;gap:8px;background:none;border:none;padding:4px 0;cursor:pointer;font-family:'Readex Pro',sans-serif;font-size:12.5px;color:rgba(10,10,10,.38);transition:color .35s ease;">
              <span data-vm-num="" dir="ltr" style="font-weight:600;transition:color .35s ease;">{{ v.num }}</span>
            </button>
          </sc-for>
        </div>
      </div>
      <div id="pv-vals-track" style="position:relative;z-index:1;display:flex;width:max-content;will-change:transform;">
        <sc-for list="{{ values }}" as="v" hint-placeholder-count="3">
          <div data-vals-panel="" style="width:100vw;flex:none;">
            <div style="position:relative;max-width:calc(1240px + 2 * clamp(20px,6vw,80px));margin:0 auto;padding:0 clamp(20px,6vw,80px);min-height:clamp(280px,42vh,440px);display:flex;flex-direction:column;justify-content:center;">
              <div data-vp-num="" dir="ltr" aria-hidden="true" style="position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:clamp(130px,23vw,290px);font-weight:700;line-height:1;color:rgba(245,1,21,.12);pointer-events:none;user-select:none;opacity:0;will-change:transform,opacity;">{{ v.num }}</div>
              <h3 data-vp-title="" style="position:relative;font-size:clamp(40px,6.4vw,92px);font-weight:700;line-height:1.05;color:#0a0a0a;opacity:0;will-change:transform,opacity;text-wrap:balance;">{{ v.title }}</h3>
              <p data-vp-desc="" style="position:relative;margin-top:clamp(18px,3vh,30px);max-width:560px;font-size:clamp(16px,1.7vw,21px);font-weight:300;line-height:1.7;color:#555;opacity:0;will-change:transform,opacity;">{{ v.desc }}</p>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <!-- CERTIFICATES — scroll parallax -->
  <section id="pv-certs" data-cert-sec="" data-screen-label="Certificates" style="position:relative;height:300vh;background:#fff;">
    <div id="pv-cert-sticky" style="position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="position:relative;z-index:1;text-align:center;padding:0 20px;max-width:820px;">
        <div data-reveal="" style="font-family:'Readex Pro',sans-serif;font-size:clamp(12px,1.2vw,15px);font-weight:700;color:#F50115;">{{ t.certsKicker }}</div>
        <h2 data-cert-title="" data-reveal="" data-reveal-delay="80" style="margin-top:16px;font-size:clamp(36px,5.6vw,76px);font-weight:800;line-height:1.04;color:#0a0a0a;text-wrap:balance;">{{ t.certsTitle }}</h2>
        <div data-cert-sub="" data-reveal="" data-reveal-delay="240" style="margin-top:14px;font-size:15.5px;font-weight:300;color:#999;">{{ t.certsHint }}</div>
      </div>
      <div data-cert-grid="" style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(1200px,92vw);display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(48px,16vw,260px);align-items:start;z-index:2;pointer-events:none;">
        <div id="pv-cert-col1" style="display:flex;flex-direction:column;gap:clamp(48px,10vh,110px);will-change:transform;">
          <sc-for list="{{ certsCol1 }}" as="c" hint-placeholder-count="3">
            <div data-cert-card="" role="button" tabindex="0" aria-label="{{ c.name }}" onClick="{{ c.open }}" onKeyDown="{{ c.key }}" style="position:relative;pointer-events:auto;cursor:zoom-in;background:#fff;padding:14px;border-radius:10px;border:1px solid #ECECEC;box-shadow:0 34px 74px -32px rgba(0,0,0,.42);max-width:320px;width:100%;align-self:{{ c.align }};transform:rotate({{ c.rot }}deg);transition:transform .45s cubic-bezier(.2,0,0,1),box-shadow .45s cubic-bezier(.2,0,0,1);">
              <img src="{{ c.img }}" alt="{{ c.name }}" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:5px;display:block;background:#F0F0F0;">
            </div>
          </sc-for>
        </div>
        <div id="pv-cert-col2" style="display:flex;flex-direction:column;gap:clamp(48px,10vh,110px);will-change:transform;">
          <sc-for list="{{ certsCol2 }}" as="c" hint-placeholder-count="3">
            <div data-cert-card="" role="button" tabindex="0" aria-label="{{ c.name }}" onClick="{{ c.open }}" onKeyDown="{{ c.key }}" style="position:relative;pointer-events:auto;cursor:zoom-in;background:#fff;padding:14px;border-radius:10px;border:1px solid #ECECEC;box-shadow:0 34px 74px -32px rgba(0,0,0,.42);max-width:320px;width:100%;align-self:{{ c.align }};transform:rotate({{ c.rot }}deg);transition:transform .45s cubic-bezier(.2,0,0,1),box-shadow .45s cubic-bezier(.2,0,0,1);">
              <img src="{{ c.img }}" alt="{{ c.name }}" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:5px;display:block;background:#F0F0F0;">
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </section>

  <!-- CERTIFICATE LIGHTBOX -->
  <div onClick="{{ closeLb }}" style="position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:{{ lbDisplay }};align-items:center;justify-content:center;padding:clamp(16px,4vw,48px);cursor:zoom-out;">
    <figure style="text-align:center;max-width:min(92vw,880px);margin:0;">
      <img src="{{ lbImg }}" alt="{{ lbName }}" style="max-width:100%;max-height:72vh;border-radius:8px;background:#fff;padding:12px;display:block;margin:0 auto;box-shadow:0 50px 140px -40px rgba(0,0,0,.9);">
      <figcaption style="margin-top:20px;color:#fff;">
        <div style="font-size:19px;font-weight:600;">{{ lbName }}</div>
        <div style="font-size:14px;font-weight:300;color:rgba(255,255,255,.65);margin-top:5px;">{{ lbIssuer }}</div>
      </figcaption>
    </figure>
