<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<title>LiftView - Perfect Vision</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html{scroll-behavior:smooth;}
  body{font-family:'Readex Pro',sans-serif;background:#fff;color:#0a0a0a;overflow-x:hidden;}
  ::selection{background:#F50115;color:#fff;}
  a{text-decoration:none;color:inherit;}
  [data-reveal]{opacity:0;transform:translateY(30px);filter:blur(10px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1),filter 1.1s cubic-bezier(.2,.7,.2,1);}
  .pv-cta{transition:background .35s ease,color .35s ease,border-color .35s ease,transform .25s ease;}
  .pv-glass-cta{transition:background .3s ease,transform .25s ease;}
  .pv-glass-cta:hover{background:rgba(10,10,10,0.08);}
  .pv-cta-circ{position:relative;overflow:hidden;}
  .pv-cta-circ .pv-arr-a,.pv-cta-circ .pv-arr-b{transition:transform .5s cubic-bezier(.2,0,0,1),opacity .35s ease;}
  .pv-cta-circ .pv-arr-b{position:absolute;transform:translateX(-170%);opacity:0;}
  .pv-glass-cta:hover .pv-arr-a{transform:translateX(170%);opacity:0;}
  .pv-glass-cta:hover .pv-arr-b{transform:translateX(0);opacity:1;transition-delay:.06s;}
  [dir="rtl"] .pv-cta-circ .pv-arr-a{transform:scaleX(-1);}
  [dir="rtl"] .pv-cta-circ .pv-arr-b{transform:translateX(170%) scaleX(-1);}
  [dir="rtl"] .pv-glass-cta:hover .pv-arr-a{transform:translateX(-170%) scaleX(-1);}
  [dir="rtl"] .pv-glass-cta:hover .pv-arr-b{transform:translateX(0) scaleX(-1);}
  .pv-cta:active{transform:scale(.98);}
  @keyframes pvxFade{from{opacity:0;}to{opacity:1;}}
  @keyframes pvxBlockIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}
  @keyframes pvxImgIn{from{opacity:0;transform:scale(1.05);}to{opacity:1;transform:scale(1);}}
  @keyframes pvxRowIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .liquid-glass{background:rgba(255,255,255,0.01);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden;}
  .liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .liquid-glass-dark{background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);position:relative;overflow:hidden;}
  .liquid-glass-dark::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  a:focus-visible,button:focus-visible,[role="button"]:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid #F50115;outline-offset:3px;border-radius:6px;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}[data-reveal]{opacity:1 !important;transform:none !important;}}
  .fvx-cmp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;}
  .fvx-bento{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch;}
  .fvx-b2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .fvx-b21{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;}
  .fvx-b12{display:grid;grid-template-columns:1fr 1.9fr;gap:20px;}
  .fvx-b3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;}
  .fvx-steps{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:clamp(16px,2vw,28px);align-items:center;}
  .fvx-duo{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(16px,2vw,28px);align-items:center;}
  .fvx-col{display:grid;gap:20px;grid-auto-rows:auto;}
  @media (max-width: 900px){.fvx-bento,.fvx-b2,.fvx-b21,.fvx-b12,.fvx-b3{grid-template-columns:1fr;}.fvx-steps,.fvx-duo{grid-template-columns:1fr;}.fvx-steps > svg,.fvx-duo > svg{display:none;}}
  @media (max-width: 1100px){.fvx-cmp-grid{grid-template-columns:1fr;}}
  @media (max-width: 900px){.pvx-hero-grid{grid-template-columns:1fr !important;}.pvx-faq-grid{grid-template-columns:1fr !important;}.pvx-faq-head{position:static !important;}}
  .pv-subhead{top:94px;transition:top .6s cubic-bezier(.2,0,0,1);}
  body.pv-mainnav-hidden .pv-subhead{top:18px;}
  .pv-allbtn{position:relative;border-radius:44px;background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);overflow:hidden;transition:background .3s ease;}
  .pv-allbtn::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-allbtn:hover{background:rgba(10,10,10,0.08);}
  .pv-carr{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s ease,opacity .3s ease;}
  .pv-carr svg{transition:transform .3s ease;flex:none;}
  .pv-carr-next:hover svg{transform:translateX(3px);}
  .pv-carr-prev svg{transform:scaleX(-1);}
  .pv-carr-prev:hover svg{transform:scaleX(-1) translateX(3px);}
  [dir="rtl"] .pv-carr-next svg{transform:scaleX(-1);}
  [dir="rtl"] .pv-carr-next:hover svg{transform:scaleX(-1) translateX(3px);}
  [dir="rtl"] .pv-carr-prev svg{transform:none;}
  [dir="rtl"] .pv-carr-prev:hover svg{transform:translateX(3px);}
  .pv-glabel.pv-allbtn:hover{background:rgba(10,10,10,0.035);}
  @keyframes pvxSwInR{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes pvxSwInL{from{transform:translateX(-100%);}to{transform:translateX(0);}}
  @keyframes pvxSwOutL{from{transform:translateX(0);}to{transform:translateX(-100%);}}
  @keyframes pvxSwOutR{from{transform:translateX(0);}to{transform:translateX(100%);}}
  @keyframes pvxLblIn{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:translateY(0);}}
  .pv-allbtn-in{display:inline-flex;align-items:center;gap:10px;border-radius:inherit;background:transparent;color:#0a0a0a;padding:12px 26px;font-size:15px;font-weight:500;}
  .pv-arr{transition:transform .3s ease;}
  .pv-allbtn:hover .pv-arr{transform:translateX(4px);}
  [dir="rtl"] .pv-arr{transform:scaleX(-1);}
  [dir="rtl"] .pv-allbtn:hover .pv-arr{transform:scaleX(-1) translateX(4px);}
  .pv-allbtn-light{background:rgba(255,255,255,0.01);background-blend-mode:luminosity;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);}
  .pv-allbtn-light::before{background:linear-gradient(180deg,rgba(255,255,255,0.5) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.5) 100%);}
  .pv-allbtn-light:hover{background:rgba(255,255,255,0.18);}
  .pv-allbtn-light .pv-allbtn-in{color:#fff;}
  /* pv-ar-leading: Arabic (RTL) leading floor. Readex Pro bold/tight headings collide between lines; any bold or tight-leaded text gets >= 1.45 leading. Site-wide, do not remove. */
  [dir="rtl"] :is(h1,h2,h3,h4,h5,h6,strong,b,[style*="font-weight: 600"],[style*="font-weight: 700"],[style*="font-weight: 800"],[style*="font-weight: bold"],[style*="font-weight:600"],[style*="font-weight:700"],[style*="font-weight:800"],[style*="font-weight:bold"],[style*="line-height: 1;"],[style*="line-height: 1.0"],[style*="line-height: 1.1"],[style*="line-height: 1.2"],[style*="line-height: 1.3"],[style*="line-height:1;"],[style*="line-height:1.0"],[style*="line-height:1.1"],[style*="line-height:1.2"],[style*="line-height:1.3"]):not(button):not(a):not(.pvh *):not([style*="nowrap"]){line-height:1.45 !important;}
</style>
</helmet>
<div dir="{{ dir }}" style="font-family:'Readex Pro',sans-serif;background:#fff;">

  <dc-import name="SiteHeader" active="solutions" bar-mode="solid" hint-size="100%,80px"></dc-import>

  <!-- ============ SECONDARY HEADER — FLOATING DEVICE SWITCHER ============ -->
  <div class="pv-subhead" style="position:sticky;z-index:40;display:flex;justify-content:center;pointer-events:none;padding-inline:clamp(12px,2.4vw,28px);">
    <div class="liquid-glass" role="tablist" aria-label="{{ t.deviceCap }}" style="pointer-events:auto;display:flex;align-items:center;gap:6px;padding:8px;padding-inline-start:22px;border-radius:40px;width:100%;max-width:1460px;background:rgba(10,10,10,.42);box-shadow:inset 0 1px 1px rgba(255,255,255,0.1),0 18px 46px -20px rgba(0,0,0,.45);color:#fff;overflow-x:auto;scrollbar-width:none;">
      <span dir="ltr" aria-hidden="true" style="flex:none;padding-inline-end:12px;font-size:15px;line-height:1;white-space:nowrap;color:#fff;"><span style="font-weight:700;">LiftView</span></span>
      <span aria-hidden="true" style="flex:none;width:1px;height:20px;background:rgba(255,255,255,.18);margin-inline-end:6px;"></span>
      <sc-for list="{{ devTabs }}" as="d" hint-placeholder-count="8">
      <button key="{{ d.key }}" role="tab" aria-selected="{{ d.sel }}" aria-label="LiftView {{ d.label }}" onClick="{{ d.go }}" dir="ltr" style="flex:1 1 0;min-width:max-content;border:none;cursor:pointer;font-family:'Readex Pro',sans-serif;font-size:13.5px;font-weight:600;line-height:1;padding:10px 24px;border-radius:30px;background:{{ d.bg }};color:{{ d.fg }};box-shadow:{{ d.shadow }};transition:background .3s cubic-bezier(.2,.7,.2,1),color .3s ease,transform .2s ease;white-space:nowrap;" style-hover="color:#fff;" style-active="transform:scale(.96);">{{ d.label }}</button>
      </sc-for>
    </div>
  </div>

  <!-- ============ HERO + LINE reveal wrapper ============ -->
  <div style="position:relative;">
  <!-- ============ HERO ============ -->
  <section data-screen-label="Hero" id="pvx-hero" style="position:relative;background:#fff;color:#0a0a0a;min-height:100vh;display:flex;align-items:center;padding:clamp(120px,15vh,170px) clamp(20px,6vw,80px) clamp(36px,5vh,64px);">
    <div class="pvx-hero-grid" style="width:100%;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(36px,5vw,72px);align-items:center;">

      <!-- Text copy (image leads in LTR) -->
      <div style="order:2;">
        <p data-reveal key="eq-{{ deviceKey }}" style="margin-bottom:12px;font-size:clamp(14px,1.15vw,16px);font-weight:600;line-height:1.3;color:#555;animation:pvxFade .5s ease both;">{{ t.kindLabel }} · <span dir="ltr" style="display:inline-block;color:#0a0a0a;">{{ deviceDescriptor }}</span></p>
        <h1 data-reveal key="name-{{ deviceKey }}" style="font-size:{{ nameSize }};font-weight:700;line-height:1.02;color:#F50115;animation:pvxFade .5s ease both;text-align:start;display:flex;flex-direction:column;align-items:flex-start;">
          <span dir="ltr" style="display:block;text-align:{{ nameAlign }};white-space:nowrap;">{{ heroName }}</span>
          <sc-if value="{{ hasName2 }}" hint-placeholder-val="{{ false }}"><span dir="ltr" style="display:block;text-align:{{ nameAlign }};">{{ heroName2 }}</span></sc-if>
        </h1>
        <p data-reveal key="sub-{{ deviceKey }}" style="margin-top:14px;font-size:clamp(15px,1.2vw,17px);font-weight:300;line-height:1.7;color:#555;text-wrap:pretty;animation:pvxFade .5s ease both;"><span dir="ltr" style="font-weight:600;color:#0a0a0a;">LMI</span> · {{ heroSub }}</p>

        <!-- component tags -->
        <div data-reveal key="kit-{{ deviceKey }}" style="margin-top:26px;background:#F0F0F0;border-radius:20px;padding:16px 18px 6px;">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid #d9d9d9;">
            <h2 style="font-size:16px;font-weight:700;line-height:1.2;color:#0a0a0a;">{{ t.kitLabel }}</h2>
            <span dir="ltr" style="font-size:13px;font-weight:600;color:#F50115;">{{ kitCount }}</span>
          </div>
          <div role="list" style="display:grid;grid-template-columns:1fr 1fr;column-gap:20px;">
            <sc-for list="{{ heroChips }}" as="c" hint-placeholder-count="5">
              <div role="listitem" key="{{ c.key }}" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #dcdcdc;font-size:14px;font-weight:500;line-height:1.35;color:#0a0a0a;animation:pvxRowIn .55s cubic-bezier(.16,1,.3,1) both;animation-delay:{{ c.delay }};">
                <span aria-hidden="true" style="flex:none;width:6px;height:6px;border-radius:50%;background:#F50115;"></span>
                <span>{{ c.label }}</span>
              </div>
            </sc-for>
          </div>
        </div>

        <!-- line indicator -->
        <div data-reveal key="hline-{{ deviceKey }}" style="margin-top:28px;display:flex;align-items:center;gap:18px;animation:pvxFade .5s ease both;">
          <span dir="ltr" style="font-size:15px;font-weight:700;color:#0a0a0a;">Base<span style="font-weight:300;">Line</span></span>
          <span style="width:1px;height:22px;background:#d6d6d6;flex:none;"></span>
          <span style="font-size:13.5px;font-weight:300;line-height:1.4;color:#666;">{{ t.heroLinesNote }}</span>
        </div>

        <!-- talk to an expert -->
        <div data-reveal style="margin-top:26px;display:flex;">
          <a class="pv-allbtn" href="contact" style="display:inline-flex;text-decoration:none;" onClick="{{ openDemo }}" aria-haspopup="dialog">
            <span class="pv-allbtn-in" style="color:#F50115;"><span style="font-weight:600;">{{ t.heroExpert }}</span><svg class="pv-ico" width="17" height="17" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="108" cy="108" r="60"></circle><path d="M24,208c20.55-24.45,49.56-40,84-40s63.45,15.55,84,40"></path><path d="M200,68.74a100.33,100.33,0,0,1,0,78.52"></path><path d="M229.36,56a132.39,132.39,0,0,1,0,104"></path></svg></span>
          </a>
        </div>
      </div>

      <!-- Square gallery -->
      <div data-reveal style="order:1;">
        <div style="position:relative;width:min(100%,calc(100vh - 260px));aspect-ratio:1;margin-inline:auto;background:#fff;border:1px solid #E4E4E4;border-radius:24px;overflow:hidden;">
          <sc-if value="{{ gPrevShow }}" hint-placeholder-val="{{ false }}">
            <img key="prev-{{ gKey }}" src="{{ gPrevSrc }}" alt="" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:{{ gAnimOut }};display:block;" />
          </sc-if>
          <img key="cur-{{ gKey }}" src="{{ gSrc }}" alt="{{ gAlt }}" style="position:relative;width:100%;height:100%;object-fit:{{ gFit }};transform:{{ gScale }};animation:{{ gAnimIn }};display:block;" />
          <p style="position:absolute;top:16px;left:16px;right:16px;z-index:6;text-align:center;font-size:12.5px;font-weight:500;color:#666;">{{ t.imgCaption }}</p>
          <div style="position:absolute;bottom:16px;left:16px;right:16px;z-index:6;display:flex;align-items:center;justify-content:center;gap:12px;">
            <sc-if value="{{ gMulti }}" hint-placeholder-val="{{ false }}">
            <button class="pv-carr pv-allbtn pv-carr-prev" onClick="{{ gPrev }}" aria-label="Previous image" style="border:none;background:none;color:#0a0a0a;flex:none;padding:0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
            </sc-if>
            <sc-if value="{{ gMulti }}" hint-placeholder-val="{{ false }}">
            <button class="pv-carr pv-allbtn pv-carr-next" onClick="{{ gNext }}" aria-label="Next image" style="border:none;background:none;color:#0a0a0a;flex:none;padding:0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
            </sc-if>
          </div>
        </div>
      </div>
    </div>
  </section>

  
  </div><!-- /reveal wrapper -->

  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;defaultDevice&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;art&quot;,&quot;tel&quot;,&quot;side&quot;,&quot;fork&quot;,&quot;craw&quot;,&quot;mobile&quot;,&quot;man&quot;,&quot;exv&quot;],&quot;default&quot;:&quot;art&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Device&quot;},&quot;defaultFaqOpen&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:-1,&quot;max&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;FAQ&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let lang = 'en';
    try { lang = localStorage.getItem('pv-lang') || 'en'; } catch (e) {}
    const dev = ['art','tel','side','fork','craw','mobile','man','exv'].indexOf(props.defaultDevice) >= 0 ? props.defaultDevice : 'art';
    const fq = parseInt(props.defaultFaqOpen, 10);
    this.state = { lang, gIdx: 0, faqOpen: isNaN(fq) ? 0 : fq, device: dev };
  }
  componentDidMount() {
    this._onLang = (e) => this.setState({ lang: e.detail });
    window.addEventListener('pv-langchange', this._onLang);
    if (window.scrollY) window.scrollTo(0, 0);
    this.initReveal();
  }
  componentDidUpdate() { this.initReveal(); }
  componentWillUnmount() { window.removeEventListener('pv-langchange', this._onLang); if (this._onScrollHero) window.removeEventListener('scroll', this._onScrollHero); if (this._io) this._io.disconnect(); }
  initReveal() {
    if (!('IntersectionObserver' in window)) { document.querySelectorAll('[data-reveal]').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; el.style.filter = 'none'; }); return; }
    if (!this._io) {
      this._io = new IntersectionObserver((entries) => {
        entries.forEach(en => {
          if (en.isIntersecting) {
            const d = parseInt(en.target.getAttribute('data-reveal-delay') || '0', 10);
            setTimeout(() => { en.target.style.opacity = '1'; en.target.style.transform = 'none'; en.target.style.filter = 'none'; }, d);
            this._io.unobserve(en.target);
          }
        });
      }, { threshold: 0.12 });
    }
    document.querySelectorAll('[data-reveal]').forEach(el => { if (!el._pvxSeen) { el._pvxSeen = true; this._io.observe(el); } });
  }

  openDemo = (e) => { if (e && e.preventDefault) e.preventDefault(); window.dispatchEvent(new CustomEvent('pv-open-demo')); };
  renderVals() {
    const isAr = this.state.lang === 'ar';
    const i = isAr ? 1 : 0;

    const T = {
      heroTag: ['Load Moment Indicator', 'مؤشر عزم الحمولة (LMI)'],
      deviceCap: ['Viewing', 'الجهاز المعروض'],
      kitLabel: ['Kit components', 'مكونات النظام'],
      kindLabel: ['Load Moment Indicator', 'مؤشر عزم الحمولة'],
      imgCaption: ['Illustrative view of the kit and its mounting points', 'صورة توضيحية لمكونات النظام ومواضع تركيبها'],
      heroTagline: ['Your fleet, fully aware.', 'أسطولك كله تحت نظرك.'],

      rule: ki < curDev.kit.length - 1 ? '1px solid #E4E4E4' : 'none',
      delay: (ki * 60) + 'ms'
    }));
    const kitCount = curDev.kit.length + (isAr ? ' مكونات' : ' parts');
    const devTabs = devices.map(d => ({
      key: d.key, label: d.label,
      sel: d.key === device ? 'true' : 'false',
      bg: d.key === device ? 'rgba(255,255,255,.12)' : 'transparent',
      fg: d.key === device ? '#fff' : 'rgba(255,255,255,.55)',
      shadow: d.key === device ? 'inset 0 1px 1px rgba(255,255,255,.22)' : 'none',
      go: () => this.setState({ device: d.key, gIdx: 0, gDir: 0, gPrevIdx: undefined })
    }));
    const red = '#F50115';

    // --- essential specs per device (bento) ---
    const specByDevice = {
      std: [
        { v: ['Up to 4Ch', 'Up to 4Ch'], vDir: 'ltr', l: ['Channels', 'القنوات'], icon: 'camera-light.svg' },
        { v: ['1080P · 140°', '1080P · 140°'], vDir: 'ltr', l: ['Road lens', 'عدسة الطريق'], icon: 'video-light.svg' },
        { v: ['IR · 170°', 'IR · 170°'], vDir: 'ltr', l: ['Driver lens', 'عدسة السائق'], icon: 'steering-wheel-light.svg' },
        { v: ['ADAS + DMS', 'ADAS + DMS'], vDir: 'ltr', l: ['AI onboard', 'الذكاء المدمج'], icon: 'ai-vision-light.svg' },
        { v: ['2× TF, up to 512GB', '2× TF, up to 512GB'], vDir: 'ltr', l: ['Storage', 'التخزين'], icon: 'sd-card-light.svg' },
        { v: ['4G LTE + WiFi', '4G LTE + WiFi'], vDir: 'ltr', l: ['Connectivity', 'الاتصال'], icon: 'wifi-high-light.svg' },
        { v: ['GPS / GNSS', 'GPS / GNSS'], vDir: 'ltr', l: ['Positioning', 'تحديد الموقع'], icon: 'map-pin-area-light.svg' },
        { v: ['DC 10–36V', 'DC 10–36V'], vDir: 'ltr', l: ['Power input', 'مدخل الطاقة'], icon: 'power-dc-light.svg' }
      ],
      pro: [
        { v: ['4Ch · 8Ch', '4Ch · 8Ch'], vDir: 'ltr', l: ['Channels (Plus · Max)', 'القنوات (Plus · Max)'], icon: 'camera-light.svg' },
        { v: ['Boxed recorder', 'مسجل صندوقي'], vDir: null, l: ['Form factor', 'الهيكل'], icon: 'hard-drives-light.svg' },
        { v: ['ADAS + DMS + BSD', 'ADAS + DMS + BSD'], vDir: 'ltr', l: ['AI onboard', 'الذكاء المدمج'], icon: 'ai-vision-light.svg' },
        { v: ['Up to 2TB HDD/SSD', 'Up to 2TB HDD/SSD'], vDir: 'ltr', l: ['Storage (Max)', 'التخزين (Max)'], icon: 'sd-card-light.svg' },
        { v: ['Two-way intercom', 'اتصال ثنائي الاتجاه'], vDir: null, l: ['Audio', 'الصوت'], icon: 'speaker-high-light.svg' },
        { v: ['Reverse + signals', 'رجوع + إشارات'], vDir: null, l: ['Trigger inputs', 'مداخل التحفيز'], icon: 'lightning-light.svg' },
        { v: ['7-inch cab monitor', 'شاشة مقصورة 7 بوصات'], vDir: null, l: ['Optional display', 'شاشة اختيارية'], icon: 'touch-display-light.svg' },
        { v: ['DC 8–36V', 'DC 8–36V'], vDir: 'ltr', l: ['Power input', 'مدخل الطاقة'], icon: 'power-dc-light.svg' }
      ]
    };
    const specCells = specByDevice.std.map((c, idx) => ({
      key: device + '-sc-' + idx,
      value: c.v[i],
      label: c.l[i],
      valDir: c.vDir || (isAr ? 'rtl' : 'ltr'),
      valAlign: isAr ? 'right' : 'left',
      iconFile: c.icon,
      iconColor: red,
      d: (idx * 45) + 'ms'
    }));

    // --- faq (shared) ---
    const faqData = [
      { q: ['What does a load moment indicator actually do?', 'ما الذي يفعله مؤشر عزم الحمولة فعلًا؟'],
        a: ['It watches the load moment: the weight being lifted together with its distance from the center of rotation. Sensors read the load, the boom angle and the machine tilt during the whole lift, and the display shows the operator where the machine stands against its rated chart. When the limit gets close, the alarm sounds before the load becomes a problem.', 'يراقب عزم الحمولة: وزن الحمل مع بعده عن مركز الدوران. تقرأ الحساسات الحمل وزاوية الذراع وميل المعدة طوال عملية الرفع، وتعرض الشاشة للمشغّل موضع المعدة بالنسبة لجدول حمولتها. وعند الاقتراب من الحد يصدر الإنذار قبل أن يصبح الحمل مشكلة.'] },
      { q: ['Which LiftView fits my machine?', 'أي إصدار من LiftView يناسب معدتي؟'],
        a: ['One per machine type: articulated boom truck, telescopic boom truck, side boom, forklift, crawler crane, mobile crane, manlift and excavator. The reading principle is the same in all of them. What changes is the sensor kit, because a forklift is measured by mast tilt and weight while a side boom is measured by boom angle and a load pin.', 'إصدار لكل نوع من المعدات: الرافعة ذات الذراع المفصلي، والذراع التلسكوبي، ورافعة الأنابيب الجانبية (سايد بوم)، والرافعة الشوكية، والرافعة الزاحفة، والرافعة المتحركة، ومنصة رفع الأفراد (مان لفت)، والحفار. مبدأ القياس واحد في جميعها، والذي يتغير هو طقم الحساسات: فالرافعة الشوكية تُقاس بميل الصاري والوزن، بينما تُقاس رافعة الأنابيب الجانبية بزاوية الذراع ومسمار قياس الحمل.'] },
      { q: ['What comes in the kit?', 'ما مكونات الطقم؟'],
        a: ['A display unit and a control unit in every kit, then the sensors the machine needs: angle or inclinometer sensors, load cells or a hydraulic pressure sensor, an A2B switch on the crane builds, an anemometer on crawler cranes, and the cables and installation kit. The kit list for the machine you selected is shown at the top of this page.', 'شاشة عرض ووحدة تحكم في كل طقم، ثم الحساسات التي تحتاجها المعدة: حساسات الزاوية أو الميل، وحساسات الوزن أو حساس الضغط الهيدروليكي، ومفتاح الحد العلوي A2B في إصدارات الرافعات، ومقياس سرعة الرياح في الرافعات الزاحفة، والكابلات وطقم التركيب. وقائمة مكونات المعدة التي اخترتها معروضة أعلى هذه الصفحة.'] },
      { q: ['What happens when the load crosses the limit?', 'ماذا يحدث عند تجاوز الحمل للحد المسموح؟'],
        a: ['The system raises a visual and audible alarm so the operator can correct the lift, by reducing the load or repositioning the machine. On the mobile crane build the system can go further and stop the lift once the limit is crossed.', 'يُصدر النظام إنذارًا مرئيًا ومسموعًا ليصحّح المشغّل عملية الرفع، بتقليل الحمل أو تغيير موضع المعدة. وفي إصدار الرافعة المتحركة يمكن للنظام أن يذهب أبعد من ذلك ويوقف الرفع عند تجاوز الحد.'] },
      { q: ['Does it keep a record of the lifts?', 'هل يحفظ سجلًا لعمليات الرفع؟'],
        a: ['Yes, on the builds that log. The articulated boom truck kit records every lift, and the forklift kit keeps its readings even if power drops. The display stays readable in direct sunlight, so the operator reads the same data on site that the record shows later.', 'نعم، في الإصدارات التي تسجّل. طقم الرافعة ذات الذراع المفصلي يسجّل كل عملية رفع، وطقم الرافعة الشوكية يحفظ قراءاته حتى عند انقطاع الكهرباء. والشاشة تبقى واضحة تحت أشعة الشمس المباشرة، فيقرأ المشغّل في الموقع البيانات نفسها التي يظهرها السجل لاحقًا.'] }
    ];
    const faqItems = faqData.map((it, idx) => {
      const open = this.state.faqOpen === idx;
      return {
        key: 'faq-' + idx,
        n: String(idx + 1).padStart(2, '0'),
        q: it.q[i], a: it.a[i], open,
        expanded: open ? 'true' : 'false',
        qColor: open ? '#0a0a0a' : '#1a1a1a',
        chevron: open ? 'rotate(180deg)' : 'rotate(0deg)',
        toggle: () => this.setState(s => ({ faqOpen: s.faqOpen === idx ? -1 : idx }))
      };
    });

    // --- comparison (shared) ---
    const rowLabels = [['Cameras', 'الكاميرات'], ['AI onboard', 'الذكاء المدمج'], ['Storage', 'التخزين'], ['Install', 'التركيب']];
    const cmpData = [
      { suffix: '', tag: '4Ch AI Dashcam',
        line: ['One sealed unit on the windshield. Fitted and running the same day.', 'وحدة واحدة مغلقة على الزجاج الأمامي. تركب وتعمل في اليوم نفسه.'],
        vals: [
          { v: ['Up to 4Ch', 'Up to 4Ch'], dir: 'ltr' },
          { v: ['ADAS + DMS', 'ADAS + DMS'], dir: 'ltr' },
          { v: ['2× TF, up to 512GB', '2× TF, up to 512GB'], dir: 'ltr' },
          { v: ['Windshield mount', 'تثبيت على الزجاج'], dir: null }
        ],
        fit: ['Sedans, pickups & vans', 'السيارات والبيك أب والفانات'] },
      { suffix: ' +', tag: '4Ch AI MDVR',
        line: ['A boxed recorder with four modular cameras, placed where the vehicle needs them.', 'مسجل صندوقي بأربع كاميرات معيارية تتوزع حيث تحتاجها المركبة.'],
        vals: [
          { v: ['4Ch AHD', '4Ch AHD'], dir: 'ltr' },
          { v: ['ADAS + DMS', 'ADAS + DMS'], dir: 'ltr' },
          { v: ['Dual TF + SSD', 'Dual TF + SSD'], dir: 'ltr' },
          { v: ['Wired + vehicle triggers', 'سلكي + مداخل المركبة'], dir: null }
        ],
        fit: ['Trucks & mixed fleets', 'الشاحنات والأساطيل المختلطة'] },
      { suffix: ' Max', tag: '8Ch AI MDVR · 4 BSD',
        line: ['Eight channels and four blind-spot cameras. The full-coverage build for heavy vehicles.', 'ثماني قنوات وأربع كاميرات للنقاط العمياء. بنية التغطية الكاملة للمركبات الثقيلة.'],
        vals: [
          { v: ['8Ch · 4 BSD', '8Ch · 4 BSD'], dir: 'ltr' },
          { v: ['ADAS + DMS + BSD', 'ADAS + DMS + BSD'], dir: 'ltr' },
          { v: ['Up to 2TB HDD/SSD', 'Up to 2TB HDD/SSD'], dir: 'ltr' },
          { v: ['Wired + BSD kit', 'سلكي + طقم BSD'], dir: null }
        ],
        fit: ['Heavy trucks & buses', 'الشاحنات الثقيلة والحافلات'] }
    ];
    const cmpCols = cmpData.map((m) => ({
      suffix: m.suffix, tag: m.tag,
      line: m.line[i],
      fit: m.fit[i],
      rows: m.vals.map((r, ri) => ({
        l: rowLabels[ri][i],
        v: r.v[i],
        dir: r.dir || (isAr ? 'rtl' : 'ltr'),
        align: isAr ? 'left' : 'right'
      }))
    }));

    const activeFg = '#fff', idleBg = 'transparent', idleFg = '#999';

    return { openDemo: this.openDemo,
      dir: isAr ? 'rtl' : 'ltr',
      t,
      // device switcher
      deviceKey: device,
      heroName: names[device],
      heroName2: names2[device], hasName2: !!names2[device],
      nameSize: 'clamp(34px,4.2vw,60px)',
      nameAlign: isAr ? 'right' : 'left',
      heroSub: heroSubs[device][i],
      deviceDescriptor: descriptors[device],
      devTabs, heroChips, kitCount, gMulti: slides.length > 1,
      gFit: cur.photo ? 'cover' : 'contain', gScale: cur.photo ? 'none' : 'scale(' + (cur.scale || 1.22) + ')',
      stdShow: true, proShow: false,
      // gallery
      gSrc: cur.src, gAlt: cur.alt, gLabel: cur.label[i], gDots, gKey: gi, gPrevShow, gPrevSrc: gPrevShow ? slides[gPrevIdx].src : '', gAnimIn, gAnimOut,
      gPrev: () => this.setState(s => ({ gPrevIdx: s.gIdx, gDir: -1, gIdx: (s.gIdx + slides.length - 1) % slides.length })),
      gNext: () => this.setState(s => ({ gPrevIdx: s.gIdx, gDir: 1, gIdx: (s.gIdx + 1) % slides.length })),
      arrowFlip: isAr ? 'scaleX(-1)' : 'none',
      arrowFlipNext: isAr ? 'scaleX(-1)' : 'none',
      // line block
      blueChips: ['4G LTE + GPS', ['Cloud configuration', 'إعداد سحابي'][i], ['Fleetic platform', 'منصة Fleetic'][i]],
      // features + bento
      specCells,
      // faq
      faqItems,
      // comparison
      cmpCols
    };
  }
}
</script>
