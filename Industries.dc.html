<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html{scroll-behavior:smooth;}
  body{font-family:'Readex Pro',sans-serif;background:#fff;color:#0a0a0a;overflow-x:hidden;}
  ::selection{background:#F50115;color:#fff;}
  a{text-decoration:none;color:inherit;}
  a:hover{color:inherit;}
  [data-reveal]{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1);}
  .pv-cta{transition:background .35s ease,color .35s ease,border-color .35s ease,transform .25s ease;}
  .liquid-glass{background:rgba(255,255,255,0.01);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden;}
  .liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  /* light frosted-glass system — consistent with header .liquid-glass, tuned for light surfaces */
  .liquid-glass-dark{background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);position:relative;overflow:hidden;}
  .liquid-glass-dark::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-glass-card{background:rgba(255,255,255,0.55);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:none;position:relative;overflow:hidden;box-shadow:0 24px 60px -26px rgba(10,10,10,.28),inset 0 1px 1px rgba(255,255,255,.9);}
  .pv-glass-card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.35) 32%,rgba(10,10,10,.05) 72%,rgba(10,10,10,.12) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-glass-pill{background:rgba(255,255,255,0.5);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:none;position:relative;overflow:hidden;box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 4px 14px -6px rgba(10,10,10,.18);}
  .pv-glass-pill::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(10,10,10,.14));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-glass-dark{background:rgba(255,255,255,0.16);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:none;position:relative;overflow:hidden;box-shadow:inset 0 1px 1px rgba(255,255,255,.28);}
  .pv-glass-dark::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.08));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-stack-card{transform-origin:center top;will-change:transform;}
  /* pv-a11y-phase1 */
  a:focus-visible,button:focus-visible,[role="button"]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #F50115;outline-offset:3px;border-radius:6px;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}[data-reveal]{opacity:1 !important;transform:none !important;}.pv-stack-card{transform:none !important;}[data-w]{opacity:1 !important;}}
  /* pv-ar-leading: Arabic (RTL) leading floor. Readex Pro bold/tight headings collide between lines; any bold or tight-leaded text gets >= 1.45 leading. Site-wide, do not remove. */
  [dir="rtl"] :is(h1,h2,h3,h4,h5,h6,strong,b,[style*="font-weight: 600"],[style*="font-weight: 700"],[style*="font-weight: 800"],[style*="font-weight: bold"],[style*="font-weight:600"],[style*="font-weight:700"],[style*="font-weight:800"],[style*="font-weight:bold"],[style*="line-height: 1;"],[style*="line-height: 1.0"],[style*="line-height: 1.1"],[style*="line-height: 1.2"],[style*="line-height: 1.3"],[style*="line-height:1;"],[style*="line-height:1.0"],[style*="line-height:1.1"],[style*="line-height:1.2"],[style*="line-height:1.3"]):not(button):not(a):not(.pvh *):not([style*="nowrap"]){line-height:1.45 !important;}
</style>
</helmet>
<div dir="{{ dir }}" style="font-family:'Readex Pro',sans-serif;">

  <dc-import name="SiteHeader" active="industries" bar-mode="solid" hint-size="100%,80px"></dc-import>

  <!-- SECTORS -->
  <section data-stack-section data-screen-label="Sectors stack" style="position:relative;z-index:5;background:linear-gradient(180deg,#eceef2 0%,#f5f6f8 46%,#e9ebef 100%);color:#0a0a0a;padding:clamp(120px,10vw,160px) clamp(20px,6vw,80px) clamp(50px,6vw,100px);">
    <div style="max-width:1240px;margin:0 auto;">

      <h2 data-reveal style="margin-top:16px;font-size:clamp(40px,6.4vw,96px);font-weight:700;line-height:1;text-wrap:balance;background:linear-gradient(180deg,#0a0a0a 25%,rgba(10,10,10,.4) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;">{{ t.stackHead }}</h2>
      <p data-word-reveal style="margin-top:26px;max-width:780px;font-size:clamp(17px,1.9vw,25px);font-weight:300;line-height:1.6;color:#0a0a0a;">
        <sc-for list="{{ introWords }}" as="w" hint-placeholder-count="12"><span data-w style="opacity:.2;">{{ w.t }} </span></sc-for>
      </p>

      <div data-stack-parent style="margin-top:clamp(30px,4vw,56px);position:relative;">
        <sc-for list="{{ industries }}" as="ind" hint-placeholder-count="4">
          <div style="position:sticky;top:0;height:100vh;display:flex;align-items:flex-start;padding-top:{{ ind.stickTop }};">
            <div class="pv-stack-card pv-glass-card" data-stack-card data-screen-label="{{ ind.title }}" style="width:100%;height:clamp(560px,calc(100vh - 150px),920px);overflow:hidden;color:#0a0a0a;border-radius:24px;padding:clamp(18px,2.6vw,34px);display:flex;flex-direction:column;gap:clamp(16px,2.2vw,28px);">

              <!-- top row -->
              <div style="flex-shrink:0;display:flex;align-items:flex-start;gap:clamp(16px,2.6vw,36px);flex-wrap:wrap;">
                <div style="font-weight:200;font-size:clamp(56px,7vw,112px);line-height:.9;color:#F50115;">{{ ind.num }}</div>
                <div style="flex:1;min-width:230px;">
                  <h3 style="font-size:clamp(30px,3.8vw,54px);font-weight:700;line-height:1.02;">{{ ind.title }}</h3>
                  <p style="margin-top:12px;max-width:560px;min-height:3.3em;font-size:15.5px;font-weight:300;line-height:1.65;color:rgba(10,10,10,.72);">{{ ind.desc }}</p>
                  <div style="margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;">
                    <sc-for list="{{ ind.products }}" as="pr" hint-placeholder-count="3">
                      <a href="{{ pr.href }}" class="pv-cta liquid-glass-dark" style="font-size:12px;padding:9px 17px;border-radius:30px;color:#0a0a0a;" style-hover="background:rgba(10,10,10,.08);">{{ pr.label }}</a>
                    </sc-for>
                  </div>
                </div>
                <a class="pv-cta liquid-glass-dark" href="{{ ind.firstHref }}" style="flex-shrink:0;border-radius:44px;padding:15px 32px;font-size:13px;font-weight:500;color:#0a0a0a;" style-hover="background:rgba(10,10,10,.08);">{{ t.explore }}</a>
              </div>

              <!-- image mosaic — 2 stacked on the start side, 1 tall on the other -->
              <div style="flex:1;min-height:0;display:grid;grid-template-columns:{{ ind.gCols }};grid-template-rows:{{ ind.gRows }};gap:clamp(10px,1.4vw,18px);">
                <div style="grid-column:{{ ind.c1 }};grid-row:{{ ind.r1 }};position:relative;overflow:hidden;border-radius:18px;background:#f0f0f0;">
                  <img src="{{ ind.img1 }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;" />
                </div>
                <div style="grid-column:{{ ind.c2 }};grid-row:{{ ind.r2 }};position:relative;overflow:hidden;border-radius:18px;background:#f0f0f0;">
                  <img src="{{ ind.img2 }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;" />
                </div>
                <div style="grid-column:{{ ind.c3 }};grid-row:{{ ind.r3 }};position:relative;overflow:hidden;border-radius:18px;background:#f0f0f0;">
                  <img src="{{ ind.img3 }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;display:block;" />
                </div>
              </div>

            </div>
          </div>
        </sc-for>
      </div>

    </div>
  </section>


  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let lang = 'en';
    try { lang = localStorage.getItem('pv-lang') || 'en'; } catch (e) {}
    this.state = { lang };
  }
  componentDidMount() {
    this._onLang = (e) => this.setState({ lang: e.detail });
    window.addEventListener('pv-langchange', this._onLang);
    this._reduced = false;
    try { this._reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    this._onScroll = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = null; this.updateStack(); });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    window.addEventListener('resize', this._onScroll);
    this.initReveal();
    this.updateStack();
  }
  componentDidUpdate() { this.initReveal(); this.updateStack(); }
  componentWillUnmount() {
    window.removeEventListener('pv-langchange', this._onLang);
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onScroll);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._io) this._io.disconnect();
  }
  initReveal() {
    if (!('IntersectionObserver' in window)) { document.querySelectorAll('[data-reveal]').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; }); return; }
    if (!this._io) this._io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'translateY(0)'; this._io.unobserve(e.target); } }), { threshold: 0.12, rootMargin: '0px 0px -7% 0px' });
    document.querySelectorAll('[data-reveal]').forEach(el => { if (!el._o) { el._o = true; this._io.observe(el); } });
  }
  updateStack() {
    // Sticky-stacking cards: each stuck card scales down as the following cards scroll over it.
    const cards = Array.prototype.slice.call(document.querySelectorAll('[data-stack-card]'));
    const N = cards.length;
    const parent = document.querySelector('[data-stack-parent]');
    if (!this._reduced && parent && N) {
      const pr = parent.getBoundingClientRect();
      const ch = cards[0].parentElement.getBoundingClientRect().height || window.innerHeight;
      const s = -pr.top;
      cards.forEach((card, i) => {
        // q: progress of the NEXT card covering this one (one viewport worth of scroll)
        const q = i === N - 1 ? 0 : Math.min(Math.max((s - i * ch) / ch, 0), 1);
        const scale = 1 - q * 0.05;
        // stay fully visible for the first quarter, then fade out completely as it gets covered
        const fade = Math.min(Math.max((q - 0.25) / 0.75, 0), 1);
        card.style.transform = 'scale(' + scale.toFixed(4) + ')';
        card.style.opacity = (1 - fade).toFixed(3);
      });
    }
    // Word-by-word scroll reveal for the intro paragraph
    const para = document.querySelector('[data-word-reveal]');
    if (para) {
      const words = para.querySelectorAll('[data-w]');
      const n = words.length;
      if (n) {
        let prog = 1;
        if (!this._reduced) {
          const pr = para.getBoundingClientRect();
          const vh = window.innerHeight;
          const start = vh * 0.9, end = vh * 0.35;
          prog = Math.min(Math.max((start - pr.top) / (start - end), 0), 1);
        }
        const f = prog * n;
        for (let i = 0; i < n; i++) {
          let o = 0.2;
          if (f >= i + 1) o = 1; else if (f > i) o = 0.2 + 0.8 * (f - i);
          words[i].style.opacity = o;
        }
      }
    }
  }

      heavy: ['assets/photos/perfect-vision-photo-excavators-demolition.webp', 'assets/photos/perfect-vision-photo-wheel-loader-shore.webp', 'assets/photos/perfect-vision-photo-excavator-sunrise-ridge.webp'],
      mega: ['assets/photos/perfect-vision-photo-rebar-crew-at-height.webp', 'assets/photos/perfect-vision-photo-highrise-site-topdown.webp', 'assets/photos/perfect-vision-photo-construction-site-aerial.webp'],
      petro: ['assets/photos/perfect-vision-photo-foundry-sparks-night.webp', 'assets/photos/perfect-vision-photo-crew-gas-plant.webp', 'assets/photos/perfect-vision-photo-petrochemical-plant.webp']

        { num: '04', title: '\u0627\u0644\u0628\u062a\u0631\u0648\u0643\u064a\u0645\u0627\u0648\u064a\u0627\u062a', cat: '\u0627\u0644\u0645\u0635\u0627\u0646\u0639 \u0648\u0627\u0644\u0645\u062c\u0645\u0639\u0627\u062a \u0627\u0644\u0635\u0646\u0627\u0639\u064a\u0629', imgs: IMG.petro, desc: '\u0628\u064a\u0626\u0627\u062a \u0639\u0627\u0644\u064a\u0629 \u0627\u0644\u062e\u0637\u0648\u0631\u0629 \u0644\u0627 \u062a\u0642\u0628\u0644 \u0627\u0644\u0645\u0633\u0627\u0648\u0645\u0629 \u0641\u064a \u062c\u0648\u062f\u0629 \u0627\u0644\u0647\u0648\u0627\u0621 \u0648\u0627\u0644\u0633\u0644\u0627\u0645\u0629 \u0645\u0646 \u0627\u0644\u062d\u0631\u0627\u0626\u0642.', products: [ { label: 'AirView', href: 'AirView.dc.html' }, { label: 'TrackView', href: 'TrackView.dc.html' } ] }
      ]
    };
    const t = isAr ? ar : en;
