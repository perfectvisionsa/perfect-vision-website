<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html{scroll-behavior:smooth;}
  body{font-family:'Readex Pro',sans-serif;background:#fff;color:#0a0a0a;overflow-x:hidden;}
  ::selection{background:#F50115;color:#fff;}
  a{text-decoration:none;color:inherit;}
  a:hover{color:inherit;}
  [data-reveal]{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1);}
  .pvc-row{transition:background .25s ease;}
  .pvc-row .pvc-val{transition:color .25s ease,transform .35s cubic-bezier(.32,.72,0,1);}
  .pvc-row .pvc-arr{transition:transform .35s cubic-bezier(.32,.72,0,1),color .25s ease;}
  .pvc-row .pvc-lbl{transition:color .25s ease;}
  .pvc-row .pvc-val,.pvc-row .pvc-arr{color:#0a0a0a;}
  .pvc-row .pvc-lbl{color:#3a3a3a;}
  .pvc-row:hover .pvc-val,.pvc-row:hover .pvc-lbl,.pvc-row:hover .pvc-arr,.pvc-row:hover .pvc-val *,.pvc-row:hover .pvc-lbl *{color:#F50115 !important;}
  .pvc-row:hover .pvc-arr{color:#F50115;transform:translate(3px,-3px);}
  [dir="rtl"] .pvc-row .pvc-val{text-align:right !important;}
  [dir="rtl"] .pvc-row .pvc-arr svg{transform:scaleX(-1);}
  [dir="rtl"] .pvc-row:hover .pvc-arr{transform:translate(-3px,-3px);}
  .pv-social .pv-social-ic{display:block;width:18px;height:18px;background:#0a0a0a;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat;transition:background .25s ease;}
  .pv-social:hover .pv-social-ic{background:#F50115;}
  @media (max-width:900px){.pvc-grid{grid-template-columns:1fr !important;}.pvc-side{order:-1;}.pvc-row{grid-template-columns:auto 1fr auto !important;}}
  a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid #F50115;outline-offset:3px;border-radius:6px;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}[data-reveal]{opacity:1 !important;transform:none !important;}}
  /* pv-ar-leading: Arabic (RTL) leading floor. Readex Pro bold/tight headings collide between lines; any bold or tight-leaded text gets >= 1.45 leading. Site-wide, do not remove. */
  [dir="rtl"] :is(h1,h2,h3,h4,h5,h6,strong,b,[style*="font-weight: 600"],[style*="font-weight: 700"],[style*="font-weight: 800"],[style*="font-weight: bold"],[style*="font-weight:600"],[style*="font-weight:700"],[style*="font-weight:800"],[style*="font-weight:bold"],[style*="line-height: 1;"],[style*="line-height: 1.0"],[style*="line-height: 1.1"],[style*="line-height: 1.2"],[style*="line-height: 1.3"],[style*="line-height:1;"],[style*="line-height:1.0"],[style*="line-height:1.1"],[style*="line-height:1.2"],[style*="line-height:1.3"]):not(button):not(a):not(.pvh *):not([style*="nowrap"]){line-height:1.45 !important;}
</style>
</helmet>
<div dir="{{ dir }}" style="font-family:'Readex Pro',sans-serif;">

  <dc-import name="SiteHeader" active="contact" hint-size="100%,80px"></dc-import>

  <!-- HERO -->
  <section style="position:relative;min-height:52vh;display:flex;align-items:flex-end;overflow:hidden;padding:150px clamp(20px,6vw,80px) 56px;color:#fff;">
    <img src="assets/heroes/perfect-vision-hero-contact.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;" />
    <div style="position:relative;z-index:2;max-width:1240px;margin:0 auto;width:100%;">
      <h1 data-reveal style="font-size:clamp(40px,6.4vw,92px);font-weight:700;line-height:1.02;margin-top:14px;">{{ t.heroHead }}</h1>
    </div>
  </section>

  <!-- CONTACT DETAILS -->
  <section style="background:#fff;padding:clamp(64px,8vw,120px) clamp(20px,6vw,80px);">
    <div class="pvc-grid" style="max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(40px,6vw,96px);align-items:start;">

      <!-- LIST -->
      <div style="border-top:1px solid #0a0a0a;">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
          <a class="pvc-row" data-reveal data-reveal-delay="{{ r.delay }}" href="{{ r.href }}" target="{{ r.target }}" rel="noopener" aria-label="{{ r.aria }}" style="display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:20px;padding:clamp(22px,2.6vw,34px) 0;border-bottom:1px solid #0a0a0a;">
            <div style="display:flex;align-items:baseline;">
              <span class="pvc-lbl" style="font-size:13.5px;font-weight:400;line-height:1.4;">{{ r.label }}</span>
            </div>
            <div class="pvc-val" dir="{{ r.valDir }}" style="font-size:clamp(17px,1.6vw,22px);font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums;text-align:start;overflow-wrap:anywhere;">{{ r.value }}</div>
            <div class="pvc-arr" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="8 7 17 7 17 16"></polyline></svg>
            </div>
          </a>
        </sc-for>
      </div>

      <!-- SIDE -->
      <div class="pvc-side" data-reveal data-reveal-delay="120" style="display:flex;flex-direction:column;">
        <div style="width:40px;height:4px;background:#F50115;"></div>
        <h2 style="margin-top:22px;font-size:clamp(22px,2.2vw,30px);font-weight:700;line-height:1.2;text-wrap:balance;">{{ t.bigHead }}</h2>
        <p style="margin-top:12px;font-size:14.5px;font-weight:300;line-height:1.7;color:#555;text-wrap:pretty;">{{ t.sub }}</p>

        <div style="margin-top:28px;border-top:1px solid #0a0a0a;border-bottom:1px solid #0a0a0a;padding:16px 0;display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:baseline;">
          <div style="font-size:11px;font-weight:600;color:#F50115;">{{ t.hoursLabel }}</div>
          <div>
            <div style="font-size:14.5px;font-weight:500;line-height:1.5;color:#0a0a0a;">{{ t.hoursDays }}</div>
            <div style="font-size:14px;font-weight:300;line-height:1.5;color:#3a3a3a;font-variant-numeric:tabular-nums;">{{ t.hoursTime }}</div>
          </div>
        </div>

        <div style="margin-top:22px;display:flex;gap:4px;align-items:center;margin-inline-start:-12px;">
          <sc-for list="{{ socials }}" as="s" hint-placeholder-count="4">
            <a class="pv-social" href="{{ s.href }}" target="_blank" rel="noopener" aria-label="{{ s.name }}" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;"><span class="pv-social-ic" style="--ic:url('{{ s.icon }}');"></span></a>
          </sc-for>
        </div>
      </div>

    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>

  <template id="__bundler_thumbnail" data-bg-color="#910C07">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#910C07"/>
      <path d="M600 300 L640 380 L720 400 L640 420 L600 500 L560 420 L480 400 L560 380 Z" fill="#ffffff"/>
      <text x="600" y="600" font-family="sans-serif" font-size="60" font-weight="700" fill="#ffffff" text-anchor="middle">Perfect Vision</text>
    </svg>
  </template>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+966 13 893 3338&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;},&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+966 13 893 3338&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;info@perfectvisionksa.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let lang = 'en';
    try { lang = localStorage.getItem('pv-lang') || 'en'; } catch (e) {}
    this.state = { lang };
  }
  componentDidMount() { this._onLang = (e) => this.setState({ lang: e.detail }); window.addEventListener('pv-langchange', this._onLang); this.initReveal(); }
  componentDidUpdate() { this.initReveal(); }
  componentWillUnmount() { window.removeEventListener('pv-langchange', this._onLang); if (this._io) this._io.disconnect(); }
  initReveal() {
    if (!('IntersectionObserver' in window)) { document.querySelectorAll('[data-reveal]').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; }); return; }
    if (!this._io) this._io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { const d = parseInt(e.target.getAttribute('data-reveal-delay') || '0', 10); e.target.style.transitionDelay = d + 'ms'; e.target.style.opacity = '1'; e.target.style.transform = 'translateY(0)'; this._io.unobserve(e.target); } }), { threshold: 0.05, rootMargin: '0px 0px -4% 0px' });
    document.querySelectorAll('[data-reveal]').forEach(el => { if (!el._o) { el._o = true; this._io.observe(el); } });
  }
  renderVals() {
    const isAr = this.state.lang === 'ar';
    const phone = this.props.phone ?? '+966 13 893 3338';
    const whatsapp = this.props.whatsapp ?? phone;
    const email = this.props.email ?? 'info@perfectvisionksa.com';
    const digits = s => s.replace(/[^\d]/g, '');
    const hqMapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Novotel Business Park, Tower 3, King Fahad Road, Al Khalidiyah Ash Shamaliyah, Dammam 32232');
    const factoryMapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Modon Tower, 1st Industrial City, Dammam');
    const socials = [
      { name: 'LinkedIn', icon: 'assets/social/icon-social-linkedin.svg', href: '#' },
      { name: 'X', icon: 'assets/social/icon-social-x.svg', href: '#' },
      { name: 'Instagram', icon: 'assets/social/icon-social-instagram.svg', href: '#' },
      { name: 'YouTube', icon: 'assets/social/icon-social-youtube.svg', href: '#' }
    ];
    const en = {
      heroHead: 'Contact us',
      bigHead: 'One call puts a safety specialist on your site.',
      sub: 'We answer during working hours and stay with you from the first survey to the last device installed.',
      hoursLabel: 'Working hours', hoursDays: 'Sunday to Thursday', hoursTime: '8:00 AM to 5:00 PM',
      labels: ['WhatsApp', 'Direct call', 'Email', 'Headquarters', 'Factory'],
      hq: 'Novotel Business Park, Al Khalidiyah Al Shamaliyah, Dammam',
      factory: 'Modon Tower, 1st Industrial City, Dammam',
      aria: ['Open WhatsApp chat', 'Call us', 'Send an email', 'Open headquarters in maps', 'Open factory location in maps']
    };
    const ar = {
      heroHead: 'اتصل بنا',
      bigHead: 'مكالمة واحدة تكفي ليصل مختص سلامة إلى موقعك.',
      sub: 'نرد خلال ساعات العمل، ونبقى معك من أول زيارة للموقع حتى تركيب آخر جهاز.',
      hoursLabel: 'ساعات العمل', hoursDays: 'الأحد إلى الخميس', hoursTime: '8:00 صباحًا إلى 5:00 مساءً',
      labels: ['واتساب', 'اتصال مباشر', 'البريد الإلكتروني', 'المقر الرئيسي', 'المصنع'],
      hq: 'نوفوتيل بزنس بارك، الخالدية الشمالية، الدمام',
      factory: 'برج مدن، المدينة الصناعية الأولى، الدمام',
      aria: ['افتح محادثة واتساب', 'اتصل بنا', 'أرسل بريدًا', 'افتح المقر الرئيسي في الخرائط', 'افتح موقع المصنع في الخرائط']
    };
    const t = isAr ? ar : en;
    const rows = [
      { num: '01', label: t.labels[2], value: email, valDir: 'ltr', href: 'mailto:' + email, target: '_self', aria: t.aria[2] },
      { num: '02', label: t.labels[1], value: phone, valDir: 'ltr', href: 'tel:' + '+' + digits(phone), target: '_self', aria: t.aria[1] },
      { num: '04', label: t.labels[3], value: t.hq, valDir: isAr ? 'rtl' : 'ltr', href: hqMapsUrl, target: '_blank', aria: t.aria[3] },
      { num: '05', label: t.labels[4], value: t.factory, valDir: isAr ? 'rtl' : 'ltr', href: factoryMapsUrl, target: '_blank', aria: t.aria[4] }
    ];
    rows.forEach((r, i) => { r.delay = String(i * 90); });
    return { dir: isAr ? 'rtl' : 'ltr', t, rows, socials };
  }
}
</script>
</body>
</html>
