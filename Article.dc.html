<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html{scroll-behavior:smooth;}
  body{font-family:'Readex Pro',sans-serif;background:#fff;color:#0a0a0a;overflow-x:hidden;}
  ::selection{background:#F50115;color:#fff;}
  a{text-decoration:none;color:inherit;}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);}
  .pv-cta{transition:background .35s ease,color .35s ease,border-color .35s ease,transform .25s ease;}
  .pv-allbtn{position:relative;border-radius:44px;background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);overflow:hidden;transition:background .3s ease;}
  .pv-allbtn::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-allbtn:hover{background:rgba(10,10,10,0.08);}
  .pv-allbtn-in{display:inline-flex;align-items:center;gap:10px;border-radius:inherit;background:transparent;color:#0a0a0a;padding:12px 26px;font-size:15px;font-weight:500;}
  .pv-arr{transition:transform .3s ease;}
  .pv-allbtn:hover .pv-arr{transform:translateX(4px);}
  [dir="rtl"] .pv-arr{transform:scaleX(-1);}
  [dir="rtl"] .pv-allbtn:hover .pv-arr{transform:scaleX(-1) translateX(4px);}
  .pv-arr-back{transition:translate .3s ease;}
  .pv-allbtn:hover .pv-arr-back{translate:-4px 0;}
  [dir="rtl"] .pv-arr-back{transform:scaleX(-1);}
  [dir="rtl"] .pv-allbtn:hover .pv-arr-back{translate:4px 0;}
  .liquid-glass-dark{background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;position:relative;box-shadow:inset 0 1px 1px rgba(255,255,255,0.5);}
  .liquid-glass-dark::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
  .pv-glass-btn{transition:background .3s ease,transform .25s ease;}
  .pv-glass-btn:hover{background:rgba(10,10,10,.08);}
  .pv-news:hover .pv-news-img{transform:scale(1.06);}
  .pv-news-img{transition:transform .7s cubic-bezier(.2,.7,.2,1);}
  /* pv-a11y-phase1 */
  a:focus-visible,button:focus-visible,[role="button"]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #F50115;outline-offset:3px;border-radius:6px;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}[data-reveal]{opacity:1 !important;transform:none !important;}}
  /* pv-ar-leading: Arabic (RTL) leading floor. Readex Pro bold/tight headings collide between lines; any bold or tight-leaded text gets >= 1.45 leading. Site-wide, do not remove. */
  [dir="rtl"] :is(h1,h2,h3,h4,h5,h6,strong,b,[style*="font-weight: 600"],[style*="font-weight: 700"],[style*="font-weight: 800"],[style*="font-weight: bold"],[style*="font-weight:600"],[style*="font-weight:700"],[style*="font-weight:800"],[style*="font-weight:bold"],[style*="line-height: 1;"],[style*="line-height: 1.0"],[style*="line-height: 1.1"],[style*="line-height: 1.2"],[style*="line-height: 1.3"],[style*="line-height:1;"],[style*="line-height:1.0"],[style*="line-height:1.1"],[style*="line-height:1.2"],[style*="line-height:1.3"]):not(button):not(a):not(.pvh *):not([style*="nowrap"]){line-height:1.45 !important;}
</style>
</helmet>
<div dir="{{ dir }}" style="font-family:'Readex Pro',sans-serif;">

  <dc-import name="SiteHeader" active="newsroom" bar-mode="solid" hint-size="100%,80px"></dc-import>

  <!-- ARTICLE HERO -->
  <section data-screen-label="Article Hero" style="background:#fff;color:#0a0a0a;padding:clamp(120px,15vh,175px) clamp(20px,6vw,80px) clamp(10px,1.5vw,20px);">
    <div style="max-width:1240px;margin:0 auto;width:100%;padding-bottom:clamp(24px,3vw,38px);border-bottom:1px solid #E4E4E4;">
      <a class="pv-allbtn" href="Newsroom.dc.html" data-reveal style="display:inline-block;">
        <span class="pv-allbtn-in" style="color:#111;"><svg class="pv-arr-back" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>{{ t.back }}</span>
      </a>
      <h1 data-reveal style="font-size:clamp(32px,5vw,68px);font-weight:700;line-height:1.06;margin-top:26px;text-wrap:balance;">{{ a.title }}</h1>
      <div data-reveal style="display:flex;align-items:center;gap:12px;margin-top:22px;font-size:13px;color:#8A8A8A;font-weight:300;"><span>{{ a.cat }}</span><span style="color:#D4D4D4;">|</span><span>{{ a.date }}</span></div>
    </div>
  </section>

  <!-- BODY -->
  <article style="background:#fff;padding:clamp(56px,7vw,96px) clamp(20px,6vw,80px) clamp(70px,9vw,120px);">
    <div style="max-width:1240px;margin:0 auto;"><div>
      <p data-reveal style="font-size:clamp(20px,2.2vw,27px);font-weight:300;line-height:1.5;color:#1a1a1a;text-wrap:pretty;">{{ a.lead }}</p>
      <sc-for list="{{ a.blocks }}" as="b" hint-placeholder-count="4">
        <div data-reveal style="margin-top:34px;">
          <sc-if value="{{ b.isHeading }}" hint-placeholder-val="{{ false }}"><h2 style="font-size:clamp(22px,2.6vw,32px);font-weight:700;line-height:1.2;">{{ b.text }}</h2></sc-if>
          <sc-if value="{{ b.isQuote }}" hint-placeholder-val="{{ false }}"><blockquote style="border-{{ quoteSide }}:3px solid #F50115;padding-{{ quoteSide }}:24px;font-size:clamp(20px,2.2vw,26px);font-weight:400;line-height:1.45;color:#0a0a0a;font-style:normal;">{{ b.text }}</blockquote></sc-if>
          <sc-if value="{{ b.isPara }}" hint-placeholder-val="{{ true }}"><p style="font-size:17px;font-weight:300;line-height:1.75;color:#444;">{{ b.text }}</p></sc-if>
          <sc-if value="{{ b.isPhoto }}" hint-placeholder-val="{{ false }}">
            <figure style="margin:0;">
              <img src="{{ b.src }}" alt="{{ b.alt }}" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:22px;display:block;background:#F0F0F0;" />
              <figcaption style="margin-top:10px;font-size:12.5px;font-weight:300;line-height:1.5;color:#8A8A8A;">{{ b.cap }}</figcaption>
            </figure>
          </sc-if>
          <sc-if value="{{ b.isProduct }}" hint-placeholder-val="{{ false }}">
            <figure style="margin:0;">
              <img src="{{ b.src }}" alt="{{ b.alt }}" loading="lazy" style="width:100%;height:auto;display:block;border-radius:22px;background:#F0F0F0;" />
              <figcaption style="margin-top:10px;font-size:12.5px;font-weight:300;line-height:1.5;color:#8A8A8A;">{{ b.cap }}</figcaption>
            </figure>
          </sc-if>
        </div>
      </sc-for>
      <div data-reveal style="margin-top:48px;padding-top:28px;border-top:1px solid #eee;display:flex;align-items:center;gap:14px;">
        <div style="width:46px;height:46px;border-radius:50%;background:#0E8345;display:flex;align-items:center;justify-content:center;"><img src="assets/brand/perfect-vision-mark-white.webp" alt="" style="width:24px;height:24px;" /></div>
        <div><div style="font-size:15px;font-weight:600;">{{ t.bylineSub }}</div><div style="font-size:13px;color:#888;font-weight:300;">{{ t.byline }}</div></div>
      </div>
    </div></div>
  </article>

  <!-- RELATED -->
  <section style="background:#F0F0F0;padding:clamp(64px,8vw,110px) clamp(20px,6vw,80px);">
    <div style="max-width:1240px;margin:0 auto;">
      <h2 data-reveal style="font-size:clamp(22px,2.8vw,38px);font-weight:700;">{{ t.more }}</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;margin-top:32px;">
        <sc-for list="{{ related }}" as="r" hint-placeholder-count="3">
          <a class="pv-news" href="Article.dc.html" data-reveal style="display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:#fff;">
            <div style="height:180px;overflow:hidden;background:#0a0a0a;"><img class="pv-news-img" src="{{ r.img }}" alt="" style="width:100%;height:100%;object-fit:cover;opacity:.88;" /></div>
            <div style="padding:20px;">
              <div style="font-family:'Readex Pro',sans-serif;font-size:11.5px;color:#F50115;">{{ r.cat }} \u00b7 {{ r.date }}</div>
              <h3 style="font-size:18px;font-weight:600;margin-top:10px;line-height:1.3;">{{ r.title }}</h3>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let lang = 'en';
    try { lang = localStorage.getItem('pv-lang') || 'en'; } catch (e) {}
    this.state = { lang };
  }
  componentDidMount() { this._onLang = (e) => this.setState({ lang: e.detail }); window.addEventListener('pv-langchange', this._onLang); if (window.scrollY) window.scrollTo(0,0); this.initReveal(); }
  componentDidUpdate() { this.initReveal(); }
  componentWillUnmount() { window.removeEventListener('pv-langchange', this._onLang); if (this._io) this._io.disconnect(); }
  initReveal() {
    if (!('IntersectionObserver' in window)) { document.querySelectorAll('[data-reveal]').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; }); return; }
    if (!this._io) this._io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'translateY(0)'; this._io.unobserve(e.target); } }), { threshold: 0.08, rootMargin: '0px 0px -5% 0px' });
    document.querySelectorAll('[data-reveal]').forEach(el => { if (!el._o) { el._o = true; this._io.observe(el); } });
  }
  renderVals() {
    const isAr = this.state.lang === 'ar';
    const P = 'assets/photos/perfect-vision-photo-truck-dust.webp', P2 = 'assets/photos/perfect-vision-photo-fleet-row.webp', P3 = 'assets/photos/perfect-vision-photo-excavator.webp';
    const en = {
      back: 'Back to Newsroom', read: '4 min read', byline: 'Perfect Vision', bylineSub: 'Editorial Team', more: 'More from the Newsroom',
      a: { cat: 'News', date: 'Jun 2026', img: P, title: 'Perfect Vision crosses 500 connected facilities across the Kingdom',
        lead: 'Five hundred facilities now rely on Perfect Vision to keep their people aware of danger before it arrives. It is a marker of how far awareness-led safety has come in Saudi Arabia.',
        blocks: [
          { type: 'para', text: 'When the company was founded in Dammam, the goal was simple to state and hard to deliver: make the most demanding industrial environments in the Kingdom measurably safer. Five hundred facilities later, that goal has become an operating reality across construction, heavy equipment, mega-projects and petrochemical sites.' },
          { type: 'photo', src: 'assets/photos/perfect-vision-photo-megaproject-aerial.webp', alt: 'Aerial view of a mega-project under construction', cap: 'Construction, heavy equipment, mega-projects and petrochemical sites.' },
          { type: 'heading', text: 'Awareness, not paperwork' },
          { type: 'para', text: 'The real substance of the milestone is the thousands of moments each day where a worker is warned in time, a crane stays inside its safe envelope, or a gas reading triggers an evacuation before anyone is exposed. Each of those is a decision made earlier than it otherwise would have been.' },
          { type: 'quote', text: '"Specs don’t protect people. Awareness does. Every system we ship is measured against that one outcome."' },
          { type: 'para', text: 'That philosophy is also why the Base Line and Blue Line exist as a journey rather than a hierarchy. A site can start with rugged, standalone devices and grow into a fully connected network feeding the Fleetic platform, without ever replacing what already works.' },
          { type: 'heading', text: 'A Vision 2030 partner' },
          { type: 'para', text: 'Crossing 500 facilities also deepens the company’s role as an active partner in Saudi Arabia’s Vision 2030, supporting safe industrial transformation alongside national partners including NEOM, Qiddiya, SABIC and Saudi Aramco.' }
        ] },
      related: [
        { cat: 'Insights', date: 'May 2026', img: P3, title: 'Why awareness beats specifications' },
        { cat: 'News', date: 'May 2026', img: P2, title: 'AirView goes live at a SABIC complex' },
        { cat: 'Insights', date: 'Mar 2026', img: P, title: 'From device to decision: the Fleetic model' }
      ]
    };
    const ar = {
      back: 'العودة إلى الأخبار', read: '4 دقائق قراءة', byline: 'Perfect Vision', bylineSub: 'فريق التحرير', more: 'المزيد من الأخبار',
      a: { cat: 'أخبار', date: 'Jun 2026', img: P, title: 'Perfect Vision تتجاوز 500 منشأة متصلة عبر المملكة',
        lead: 'خمسمائة منشأة تعتمد الآن على Perfect Vision لإبقاء عامليها على وعي بالخطر قبل أن يصل إليهم، وهو مؤشر على مدى تقدم السلامة القائمة على الوعي بالخطر في المملكة.',
        blocks: [
          { type: 'para', text: 'عند تأسيس الشركة في الدمام، كان الهدف بسيطًا في صياغته صعبًا في تحقيقه: جعل أصعب البيئات الصناعية في المملكة أكثر أمانًا بشكل قابل للقياس. وبعد 500 منشأة، أصبح ذلك الهدف واقعًا تشغيليًا.' },
          { type: 'photo', src: 'assets/photos/perfect-vision-photo-megaproject-aerial.webp', alt: 'منظر جوي لمشروع عملاق تحت الإنشاء', cap: 'الإنشاءات والمعدات الثقيلة والمشاريع العملاقة ومواقع البتروكيماويات.' },
          { type: 'heading', text: 'وعي بالخطر، لا أوراق' },
          { type: 'para', text: 'هذا الرقم لا يتعلق بعدد الأجهزة، بل بآلاف اللحظات يوميًا التي يُنبَّه فيها العامل في الوقت المناسب، أو تبقى فيها الرافعة ضمن حدودها الآمنة.' },
          { type: 'quote', text: '\u00abالمواصفات لا تحمي البشر. الإدراك هو ما يحميهم. كل نظام نطلقه يقاس بهذه النتيجة وحدها.\u00bb' },
          { type: 'para', text: 'ولهذا صُممت فئتا Base Line وBlue Line كمسار متدرج لا كترتيب أفضلية. يمكن للموقع أن يبدأ بأجهزة مستقلة ثم يتوسع إلى شبكة متصلة بالكامل.' },
          { type: 'heading', text: 'شريك في رؤية 2030' },
          { type: 'para', text: 'تجاوز 500 منشأة يعمق دور الشركة شريكًا فاعلًا في رؤية 2030، دعمًا للتحول الصناعي الآمن مع شركاء وطنيين منهم نيوم والقدية وسابك وأرامكو السعودية.' }
        ] },
      related: [
        { cat: 'رؤى', date: 'May 2026', img: P3, title: 'لماذا يحمي الوعي بالخطر أكثر من المواصفات' },
        { cat: 'أخبار', date: 'May 2026', img: P2, title: 'AirView يبدأ العمل في مجمع سابك' },
        { cat: 'رؤى', date: 'Mar 2026', img: P, title: 'من الجهاز إلى القرار: نموذج Fleetic' }
      ]
    };
    const t = isAr ? ar : en;
    const blocks = t.a.blocks.map(b => ({ text: b.text, src: b.src, alt: b.alt, cap: b.cap, isHeading: b.type === 'heading', isQuote: b.type === 'quote', isPara: b.type === 'para', isPhoto: b.type === 'photo', isProduct: b.type === 'product' }));
    return { dir: isAr ? 'rtl' : 'ltr', t, a: { ...t.a, blocks }, related: t.related, backArrow: isAr ? '\u2192' : '\u2190', quoteSide: isAr ? 'right' : 'left' };
  }
}
</script>
</body>
</html>
