<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html{scroll-behavior:smooth;}
  body{font-family:'Readex Pro',sans-serif;background:#fff;color:#0a0a0a;overflow-x:hidden;}
  ::selection{background:#F50115;color:#fff;}
  a{text-decoration:none;color:inherit;}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);}
  .pv-cta{transition:background .35s ease,color .35s ease,border-color .35s ease,transform .25s ease;}
  .pv-allbtn{position:relative;border-radius:44px;background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);overflow:hidden;transition:background .3s ease;}
  .pv-allbtn::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;z-index:1;}
  .pv-allbtn:hover{background:rgba(10,10,10,0.08);}
  .pv-allbtn-in{display:inline-flex;align-items:center;gap:10px;border-radius:inherit;background:transparent;color:#0a0a0a;padding:12px 26px;font-size:15px;font-weight:500;}
  .pv-arr{transition:transform .3s ease;}
  .pv-allbtn:hover .pv-arr{transform:translateX(4px);}
  [dir="rtl"] .pv-arr{transform:scaleX(-1);}
  [dir="rtl"] .pv-allbtn:hover .pv-arr{transform:scaleX(-1) translateX(4px);}
  .pv-arr-back{transition:translate .3s ease;}
  .pv-allbtn:hover .pv-arr-back{translate:-4px 0;}
  [dir="rtl"] .pv-arr-back{transform:scaleX(-1);}
  [dir="rtl"] .pv-allbtn:hover .pv-arr-back{translate:4px 0;}
  .pv-news:hover .pv-news-img{transform:scale(1.06);}
  .pv-news-img{transition:transform .7s cubic-bezier(.2,.7,.2,1);}
  .liquid-glass{background:rgba(255,255,255,0.01);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden;}
  .liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1;}
  .liquid-glass-dark{background:rgba(10,10,10,0.035);background-blend-mode:luminosity;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;position:relative;box-shadow:inset 0 1px 1px rgba(255,255,255,0.5);}
  .liquid-glass-dark::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(10,10,10,0.22) 0%,rgba(10,10,10,0.08) 20%,rgba(10,10,10,0) 40%,rgba(10,10,10,0) 60%,rgba(10,10,10,0.08) 80%,rgba(10,10,10,0.22) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
  .pv-glass-btn{transition:background .3s ease,transform .25s ease;}
  .pv-glass-btn:hover{background:rgba(10,10,10,.08);}
  /* pv-a11y-phase1 */
  a:focus-visible,button:focus-visible,[role="button"]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #F50115;outline-offset:3px;border-radius:6px;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}[data-reveal]{opacity:1 !important;transform:none !important;}}
  /* pv-ar-leading: Arabic (RTL) leading floor. Readex Pro bold/tight headings collide between lines; any bold or tight-leaded text gets >= 1.45 leading. Site-wide, do not remove. */
  [dir="rtl"] :is(h1,h2,h3,h4,h5,h6,strong,b,[style*="font-weight: 600"],[style*="font-weight: 700"],[style*="font-weight: 800"],[style*="font-weight: bold"],[style*="font-weight:600"],[style*="font-weight:700"],[style*="font-weight:800"],[style*="font-weight:bold"],[style*="line-height: 1;"],[style*="line-height: 1.0"],[style*="line-height: 1.1"],[style*="line-height: 1.2"],[style*="line-height: 1.3"],[style*="line-height:1;"],[style*="line-height:1.0"],[style*="line-height:1.1"],[style*="line-height:1.2"],[style*="line-height:1.3"]):not(button):not(a):not(.pvh *):not([style*="nowrap"]){line-height:1.45 !important;}
</style>
</helmet>
<div dir="{{ dir }}" style="font-family:'Readex Pro',sans-serif;">

  <dc-import name="SiteHeader" active="newsroom" bar-mode="solid" hint-size="100%,80px"></dc-import>

  <!-- ARTICLE HERO -->
  <section data-screen-label="ISO Article Hero" style="background:#fff;color:#0a0a0a;padding:clamp(120px,15vh,175px) clamp(20px,6vw,80px) clamp(10px,1.5vw,20px);">
    <div style="max-width:1240px;margin:0 auto;width:100%;padding-bottom:clamp(24px,3vw,38px);border-bottom:1px solid #E4E4E4;">
      <a class="pv-allbtn" href="Newsroom.dc.html" data-reveal style="display:inline-block;">
        <span class="pv-allbtn-in" style="color:#111;"><svg class="pv-arr-back" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>{{ t.back }}</span>
      </a>
      <h1 data-reveal style="font-size:clamp(32px,5vw,68px);font-weight:700;line-height:1.06;margin-top:26px;text-wrap:balance;">{{ t.a.title }}</h1>
      <div data-reveal style="display:flex;align-items:center;gap:12px;margin-top:22px;font-size:13px;color:#8A8A8A;font-weight:300;"><span>{{ t.a.cat }}</span><span style="color:#D4D4D4;">|</span><span>{{ t.a.date }}</span></div>
    </div>
  </section>

  <!-- BODY -->
  <article data-screen-label="ISO Article Body" style="background:#fff;padding:clamp(56px,7vw,96px) clamp(20px,6vw,80px) clamp(70px,9vw,120px);">
    <div style="max-width:1240px;margin:0 auto;"><div>
      <p data-reveal style="font-size:clamp(20px,2.2vw,27px);font-weight:300;line-height:1.5;color:#1a1a1a;text-wrap:pretty;">{{ t.a.lead }}</p>

      <sc-for list="{{ blocksTop }}" as="b" hint-placeholder-count="2">
        <div data-reveal style="margin-top:34px;">
          <sc-if value="{{ b.isHeading }}" hint-placeholder-val="{{ false }}"><h2 style="font-size:clamp(22px,2.6vw,32px);font-weight:700;line-height:1.2;">{{ b.text }}</h2></sc-if>
          <sc-if value="{{ b.isQuote }}" hint-placeholder-val="{{ false }}"><blockquote style="border-{{ quoteSide }}:3px solid #F50115;padding-{{ quoteSide }}:24px;font-size:clamp(20px,2.2vw,26px);font-weight:400;line-height:1.45;color:#0a0a0a;font-style:normal;">{{ b.text }}</blockquote></sc-if>
          <sc-if value="{{ b.isPara }}" hint-placeholder-val="{{ true }}"><p style="font-size:17px;font-weight:300;line-height:1.75;color:#444;">{{ b.text }}</p></sc-if>
        </div>
      </sc-for>

      <!-- CERTIFICATION TIMELINE -->
      <div data-reveal style="margin-top:40px;display:flex;flex-direction:column;">
        <sc-for list="{{ timeline }}" as="m" hint-placeholder-count="4">
          <div style="display:flex;gap:24px;position:relative;">
            <div style="display:flex;flex-direction:column;align-items:center;flex:none;width:14px;">
              <div style="width:14px;height:14px;border-radius:50%;background:#F50115;flex:none;margin-top:5px;box-shadow:0 0 0 4px rgba(245,1,21,.12);"></div>
              <div style="width:2px;flex:1;background:{{ m.lineBg }};margin-top:8px;"></div>
            </div>
            <div style="flex:1;padding-bottom:{{ m.padBottom }};min-width:0;">
              <div style="font-size:12px;color:#F50115;font-weight:600;">{{ m.date }}</div>
              <h3 style="font-size:clamp(18px,2vw,23px);font-weight:700;margin-top:6px;line-height:1.25;">{{ m.std }} · {{ m.name }}</h3>
              <p style="font-size:16.5px;font-weight:300;line-height:1.7;color:#444;margin-top:8px;">{{ m.desc }}</p>
            </div>
          </div>
        </sc-for>

      <figure data-reveal style="margin:clamp(30px,4vw,48px) 0 0;">
        <img src="assets/photos/perfect-vision-photo-site-steam-crew.webp" alt="{{ t.figAlt }}" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:22px;display:block;background:#F0F0F0;" />
        <figcaption style="margin-top:10px;font-size:12.5px;font-weight:300;line-height:1.5;color:#8A8A8A;">{{ t.figCap }}</figcaption>
      </figure>
      </div>

      <sc-for list="{{ blocksBottom }}" as="b" hint-placeholder-count="3">
        <div data-reveal style="margin-top:34px;">
          <sc-if value="{{ b.isHeading }}" hint-placeholder-val="{{ false }}"><h2 style="font-size:clamp(22px,2.6vw,32px);font-weight:700;line-height:1.2;">{{ b.text }}</h2></sc-if>
          <sc-if value="{{ b.isQuote }}" hint-placeholder-val="{{ false }}"><blockquote style="border-{{ quoteSide }}:3px solid #F50115;padding-{{ quoteSide }}:24px;font-size:clamp(20px,2.2vw,26px);font-weight:400;line-height:1.45;color:#0a0a0a;font-style:normal;">{{ b.text }}</blockquote></sc-if>
          <sc-if value="{{ b.isPara }}" hint-placeholder-val="{{ true }}"><p style="font-size:17px;font-weight:300;line-height:1.75;color:#444;">{{ b.text }}</p></sc-if>
        </div>
      </sc-for>

      <div data-reveal style="margin-top:48px;padding-top:28px;border-top:1px solid #eee;display:flex;align-items:center;gap:14px;">
        <div style="width:46px;height:46px;border-radius:50%;background:#0E8345;display:flex;align-items:center;justify-content:center;"><img src="assets/brand/perfect-vision-mark-white.webp" alt="" style="width:24px;height:24px;" /></div>
        <div><div style="font-size:15px;font-weight:600;">{{ t.bylineSub }}</div><div style="font-size:13px;color:#888;font-weight:300;">{{ t.byline }}</div></div>
      </div>
    </div></div>
  </article>

  <!-- RELATED -->
  <section data-screen-label="Related News" style="background:#F0F0F0;padding:clamp(64px,8vw,110px) clamp(20px,6vw,80px);">
    <div style="max-width:1240px;margin:0 auto;">
      <h2 data-reveal style="font-size:clamp(22px,2.8vw,38px);font-weight:700;">{{ t.more }}</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;margin-top:32px;">
        <sc-for list="{{ related }}" as="r" hint-placeholder-count="3">
          <a class="pv-news" href="{{ r.href }}" data-reveal style="aspect-ratio:3/4.05;border-radius:22px;overflow:hidden;position:relative;display:block;background:#161616;">
            <img class="pv-news-img" src="{{ r.img }}" loading="lazy" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ r.pos }};" />
            <div style="position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;background:{{ r.scrim }};"></div>
            <sc-if value="{{ r.hasLogo }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(closest-side at 50% 45%,rgba(255,255,255,.86) 0%,rgba(255,255,255,.5) 55%,rgba(255,255,255,0) 100%);">
                <img src="{{ r.logo }}" alt="Saudi Aramco" style="width:58%;max-width:190px;height:auto;display:block;filter:drop-shadow(0 2px 8px rgba(255,255,255,.6));" />
              </div>
            </sc-if>
            <div style="position:absolute;left:0;right:0;bottom:0;padding:20px;">
              <h3 style="color:{{ r.ink }};font-size:20px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">{{ r.title }}</h3>
              <div style="display:flex;align-items:center;gap:10px;margin-top:10px;"><span style="font-size:11px;font-weight:600;color:{{ r.chipInk }};background:{{ r.chipBg }};padding:3px 10px;border-radius:20px;">{{ r.cat }}</span><span style="color:{{ r.inkSoft }};font-size:12.5px;">{{ r.date }}</span></div>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let lang = 'en';
    try { lang = localStorage.getItem('pv-lang') || 'en'; } catch (e) {}
    this.state = { lang };
  }
  componentDidMount() { this._onLang = (e) => this.setState({ lang: e.detail }); window.addEventListener('pv-langchange', this._onLang); if (window.scrollY) window.scrollTo(0, 0); this.initReveal(); }
  componentDidUpdate() { this.initReveal(); }
  componentWillUnmount() { window.removeEventListener('pv-langchange', this._onLang); if (this._io) this._io.disconnect(); }
  measureTone(src) {
    if (!src) return;
    this._tones = this._tones || {};
    if (src in this._tones) return;
    this._tones[src] = null;
    const img = new Image();
    img.onload = () => {
      try {
        const W = 24, H = 12, c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, Math.round(img.naturalHeight * 0.58), img.naturalWidth, Math.round(img.naturalHeight * 0.42), 0, 0, W, H);
        const d = ctx.getImageData(0, 0, W, H).data;
        let sum = 0, n = 0;
        for (let k = 0; k < d.length; k += 4) { sum += 0.2126 * d[k] + 0.7152 * d[k + 1] + 0.0722 * d[k + 2]; n++; }
        this._tones[src] = (sum / n) > 150 ? 'light' : 'dark';
      } catch (e) { this._tones[src] = 'dark'; }
      this.forceUpdate();
    };
    img.onerror = () => { this._tones[src] = 'dark'; };
    img.src = src;
  }
  initReveal() {
    if (!('IntersectionObserver' in window)) { document.querySelectorAll('[data-reveal]').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; }); return; }
    if (!this._io) this._io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'translateY(0)'; this._io.unobserve(e.target); } }), { threshold: 0.08, rootMargin: '0px 0px -5% 0px' });
    document.querySelectorAll('[data-reveal]').forEach(el => { if (!el._o) { el._o = true; this._io.observe(el); } });
  }
  renderVals() {
    const isAr = this.state.lang === 'ar';
    const BRAND = 'assets/news/perfect-vision-news-brand-launch-portrait.webp', MEGA = 'assets/photos/perfect-vision-photo-megaproject-aerial.webp';
    const DEMO = 'assets/photos/perfect-vision-photo-construction-site-aerial.webp', ARAMCO = 'assets/clients/client-logo-saudi-aramco.png';
    const en = {
      figAlt: 'Installation crew working inside a client facility', figCap: 'The audits covered the workshop floor and the installation teams working inside client facilities.',
      back: 'Back to Newsroom', read: '5 min read', byline: 'Perfect Vision', bylineSub: 'Editorial Team', more: 'More from the Newsroom',
      a: { cat: 'News', date: '1 Jul 2026', title: 'Three ISO certificates. One discipline.',
        lead: 'Perfect Vision now holds ISO 9001, ISO 45001 and ISO 14001: three certifications earned over five years, each one an independent audit of how the company actually works rather than how it describes itself.' },
      blocksTop: [
        { type: 'para', text: 'For a company whose business is keeping people safe, certification was never going to be a frame on a wall. An ISO audit asks the same question Perfect Vision’s own devices ask on site every day: does the system hold when nobody is watching? Since 2021, that answer has been examined, documented and re-examined by independent auditors three times, against three different standards.' },
        { type: 'heading', text: 'The journey, dated' }
      ],
      timeline: [
        { date: 'March 2021', std: 'ISO 9001:2015', name: 'Quality Management', desc: 'The first certificate, covering the design, supply and support of IoT safety systems out of Dammam. It obliged a young company to write down exactly how it builds things, and to keep that promise in writing, audit after audit.' },
        { date: 'September 2022', std: 'ISO 45001:2018', name: 'Occupational Health & Safety', desc: 'The one closest to home. A safety company certifying its own safety management system, from the workshop floor to installation teams working inside client facilities. The audit took nothing on trust.' },
        { date: 'May 2024', std: 'ISO 14001:2015', name: 'Environmental Management', desc: 'The same discipline, extended to environmental impact: device lifecycles, site operations, and the monitoring stations Perfect Vision deploys to measure air quality for others.' },
        { date: 'June 2026', std: 'Integrated recertification', name: 'One management system', desc: 'All three standards renewed together under a single integrated management system, audited in one pass. What began as three separate binders is now one way of working.' }
      ],
      blocksBottom: [
        { type: 'quote', text: '"A certificate is a snapshot. The point is the system behind it, and that system is audited rather than assumed."' },
        { type: 'heading', text: 'What changes for clients' },
        { type: 'para', text: 'On site, nothing changes, and that is the point. The certificates describe what more than 500 facilities already experience: traceable processes, documented installations, and a supplier whose quality, safety and environmental claims are verified by a third party rather than a brochure. For procurement teams at NEOM, SABIC, Saudi Aramco and Qiddiya, that verification is the shortest path to trust.' }
      ],
      related: [
        { cat: 'News', date: '8 Jul 2026', img: BRAND, title: 'New mark. New era. Same promise.', href: 'Article-Brand.dc.html' },
        { cat: 'News', date: '27 Apr 2026', img: MEGA, title: 'Perfect Vision crosses 500 connected facilities', href: 'Article.dc.html' },
        { cat: 'Article', date: '25 Feb 2026', img: DEMO, logo: ARAMCO, title: 'Why ProxView meets Aramco-approved safety requirements', href: 'Article-ProxView-Aramco.dc.html' }
      ]
    };
    const ar = {
      figAlt: 'فريق تركيب يعمل داخل منشأة عميل', figCap: 'شملت المراجعات ورشة العمل وفِرق التركيب العاملة داخل منشآت العملاء.',
      back: 'العودة إلى الأخبار', read: 'قراءة 5 دقائق', byline: 'Perfect Vision', bylineSub: 'فريق التحرير', more: 'المزيد من الأخبار',
      a: { cat: 'أخبار', date: '1 Jul 2026', title: 'ثلاث شهادات آيزو. منهجية واحدة.',
        lead: 'تحمل Perfect Vision اليوم شهادات ISO 9001 وISO 45001 وISO 14001، ثلاث شهادات تحققت خلال خمس سنوات، وكل واحدة منها تدقيق مستقل في طريقة عمل الشركة فعلًا، لا في طريقة حديثها عن نفسها.' },
      blocksTop: [
        { type: 'para', text: 'بالنسبة لشركة عملها حماية الأرواح، لم تكن الشهادات يومًا إطارًا معلقًا على الجدار. تدقيق الآيزو يطرح السؤال نفسه الذي تطرحه أجهزة Perfect Vision في المواقع كل يوم: هل يصمد النظام حين لا يراقبه أحد؟ ومنذ 2021، يفحص هذا الجواب ويوثق ويعاد فحصه على يد مدققين مستقلين، ثلاث مرات، وفق ثلاثة معايير مختلفة.' },
        { type: 'heading', text: 'الرحلة بتواريخها' }
      ],
      timeline: [
        { date: 'مارس 2021', std: 'ISO 9001:2015', name: 'إدارة الجودة', desc: 'الشهادة الأولى، وتغطي تصميم وتوريد ودعم أنظمة السلامة الذكية انطلاقًا من الدمام. ألزمت شركةً ناشئة بأن تكتب بدقة كيف تبني منتجاتها، وأن تفي بما كتبت، تدقيقًا بعد تدقيق.' },
        { date: 'سبتمبر 2022', std: 'ISO 45001:2018', name: 'الصحة والسلامة المهنية', desc: 'الأقرب إلى صميم العمل: شركة سلامة تعتمد نظام إدارة السلامة الخاص بها، من أرضية الورشة إلى فرق التركيب داخل منشآت العملاء. تدقيقٌ لم يأخذ شيئًا على الثقة.' },
        { date: 'مايو 2024', std: 'ISO 14001:2015', name: 'الإدارة البيئية', desc: 'المنهجية ذاتها، ممتدة إلى الأثر البيئي: دورة حياة الأجهزة، وعمليات المواقع، ومحطات الرصد التي تنشرها Perfect Vision لقياس جودة الهواء للآخرين.' },
        { date: 'يونيو 2026', std: 'إعادة اعتماد متكاملة', name: 'نظام إدارة واحد', desc: 'جددت المعايير الثلاثة معًا ضمن نظام إدارة متكامل واحد، وبتدقيق واحد. ما بدأ كثلاثة ملفات منفصلة صار طريقة عمل واحدة.' }
      ],
      blocksBottom: [
        { type: 'quote', text: '\u00abالشهادة لقطة لحظية. النظام الذي خلفها هو الغاية، وهو نظامٌ يدقق، لا يفترض.\u00bb' },
        { type: 'heading', text: 'ماذا يتغير للعملاء؟' },
        { type: 'para', text: 'في الموقع، لا شيء يتغير، وهذا هو المقصود. الشهادات توثق ما تعيشه أكثر من 500 منشأة أصلًا: إجراءات قابلة للتتبع، وتركيبات موثقة، ومورد تثبت جهة خارجية ادعاءاته في الجودة والسلامة والبيئة بدل أن يثبتها كتيب دعائي. ولفرق المشتريات في نيوم وسابك وأرامكو السعودية والقدية، هذا التحقق هو أقصر طريق إلى الثقة.' }
      ],
      related: [
        { cat: 'أخبار', date: '8 Jul 2026', img: BRAND, title: 'شعار جديد. مرحلة جديدة. الوعد نفسه.', href: 'Article-Brand.dc.html' },
        { cat: 'أخبار', date: '27 Apr 2026', img: MEGA, title: 'Perfect Vision تتجاوز 500 منشأة متصلة', href: 'Article.dc.html' },
        { cat: 'مقال', date: '25 Feb 2026', img: DEMO, logo: ARAMCO, title: 'لماذا يستوفي ProxView متطلبات السلامة المعتمدة من أرامكو', href: 'Article-ProxView-Aramco.dc.html' }
      ]
    };
    const t = isAr ? ar : en;
    const mapBlocks = (list) => list.map(b => ({ text: b.text, isHeading: b.type === 'heading', isQuote: b.type === 'quote', isPara: b.type === 'para' }));
    const timeline = t.timeline.map((m, i) => ({ ...m, lineBg: i < t.timeline.length - 1 ? '#ececec' : 'transparent', padBottom: i < t.timeline.length - 1 ? '36px' : '0px' }));
    const related = t.related.map((r, i) => {
      this.measureTone(r.img);
      const tone = (this._tones || {})[r.img] === 'light' ? 'light' : 'dark';
      return Object.assign({}, r, {
        key: 'r' + i,
        pos: r.pos || 'center',
        hasLogo: !!r.logo,
        scrim: tone === 'light'
          ? 'linear-gradient(0deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.72) 45%,rgba(255,255,255,0) 100%)'
          : 'linear-gradient(0deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.5) 45%,rgba(0,0,0,0) 100%)',
        ink: tone === 'light' ? '#0a0a0a' : '#fff',
        inkSoft: tone === 'light' ? 'rgba(10,10,10,.72)' : 'rgba(255,255,255,.86)',
        chipInk: tone === 'light' ? '#0a0a0a' : '#fff',
        chipBg: tone === 'light' ? 'rgba(10,10,10,.10)' : 'rgba(255,255,255,.22)'
      });
    });
    return { dir: isAr ? 'rtl' : 'ltr', t, blocksTop: mapBlocks(t.blocksTop), blocksBottom: mapBlocks(t.blocksBottom), timeline, related: related, backArrow: isAr ? '\u2192' : '\u2190', quoteSide: isAr ? 'right' : 'left' };
  }
}
